<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sift &middot; Recipe Manager</title>
<meta name="description" content="A Material Design 3 mockup for managing recipes: add, edit, scale ingredients live, time your steps, tag, import from text or a link, and attach photos." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ============ Design tokens (Material 3 style) ============ */
:root{
  --md-primary:#2F6B3F; --md-on-primary:#FFFFFF;
  --md-primary-container:#B9F0BE; --md-on-primary-container:#04210F;
  --md-secondary:#8A5A00; --md-on-secondary:#FFFFFF;
  --md-secondary-container:#FFDDA6; --md-on-secondary-container:#2E1800;
  --md-tertiary:#83447A; --md-on-tertiary:#FFFFFF;
  --md-tertiary-container:#FFD7F2; --md-on-tertiary-container:#38002F;
  --md-error:#BA1A1A; --md-on-error:#FFFFFF;
  --md-error-container:#FFDAD6; --md-on-error-container:#410002;
  --md-background:#F6FAF1; --md-on-background:#191D17;
  --md-surface:#F6FAF1; --md-on-surface:#191D17;
  --md-surface-variant:#DFE4D7; --md-on-surface-variant:#43483F;
  --md-outline:#73796D; --md-outline-variant:#C3C8BA;
  --md-scrim:#000000;
  --md-surface-lowest:#FFFFFF; --md-surface-low:#F0F4EB;
  --md-surface-cont:#EAEEE3; --md-surface-high:#E4E9DC;
  --md-surface-highest:#DEE3D6;
  --md-shadow-color:150 25% 15%;
  --elev1:0 1px 2px hsl(var(--md-shadow-color)/0.25), 0 1px 3px 1px hsl(var(--md-shadow-color)/0.12);
  --elev2:0 1px 2px hsl(var(--md-shadow-color)/0.25), 0 2px 6px 2px hsl(var(--md-shadow-color)/0.15);
  --elev3:0 1px 3px hsl(var(--md-shadow-color)/0.3), 0 4px 8px 3px hsl(var(--md-shadow-color)/0.15);
  --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:28px; --radius-full:999px;
  --font-ui:"Roboto",system-ui,sans-serif;
  --font-display:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --md-primary:#9DD5A2; --md-on-primary:#06390F;
    --md-primary-container:#145227; --md-on-primary-container:#B9F0BE;
    --md-secondary:#FFBB5C; --md-on-secondary:#4C2E00;
    --md-secondary-container:#6D4300; --md-on-secondary-container:#FFDDA6;
    --md-tertiary:#F5AEE8; --md-on-tertiary:#4C0F47;
    --md-tertiary-container:#672860; --md-on-tertiary-container:#FFD7F2;
    --md-error:#FFB4AB; --md-on-error:#690005;
    --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
    --md-background:#12140F; --md-on-background:#E1E4DA;
    --md-surface:#12140F; --md-on-surface:#E1E4DA;
    --md-surface-variant:#43483F; --md-on-surface-variant:#C3C8BA;
    --md-outline:#8D9387; --md-outline-variant:#43483F;
    --md-surface-lowest:#0C0F0A; --md-surface-low:#1A1D16;
    --md-surface-cont:#1E211A; --md-surface-high:#282B24;
    --md-surface-highest:#33362E;
    --md-shadow-color:150 40% 2%;
  }
}
:root[data-theme="dark"]{
  --md-primary:#9DD5A2; --md-on-primary:#06390F;
  --md-primary-container:#145227; --md-on-primary-container:#B9F0BE;
  --md-secondary:#FFBB5C; --md-on-secondary:#4C2E00;
  --md-secondary-container:#6D4300; --md-on-secondary-container:#FFDDA6;
  --md-tertiary:#F5AEE8; --md-on-tertiary:#4C0F47;
  --md-tertiary-container:#672860; --md-on-tertiary-container:#FFD7F2;
  --md-error:#FFB4AB; --md-on-error:#690005;
  --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
  --md-background:#12140F; --md-on-background:#E1E4DA;
  --md-surface:#12140F; --md-on-surface:#E1E4DA;
  --md-surface-variant:#43483F; --md-on-surface-variant:#C3C8BA;
  --md-outline:#8D9387; --md-outline-variant:#43483F;
  --md-surface-lowest:#0C0F0A; --md-surface-low:#1A1D16;
  --md-surface-cont:#1E211A; --md-surface-high:#282B24;
  --md-surface-highest:#33362E;
  --md-shadow-color:150 40% 2%;
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--md-background); color:var(--md-on-background);
  font-family:var(--font-ui); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
img{max-width:100%; display:block;}
button{font-family:inherit;}
h1,h2,h3,h4,p{margin:0;}
a{color:inherit;}

.icon{width:24px; height:24px; flex:none; display:inline-block; vertical-align:middle;}
.icon-sm{width:18px; height:18px;}
.icon-lg{width:32px; height:32px;}
.icon-xl{width:44px; height:44px;}

/* Type scale */
.type-display{font-family:var(--font-display); font-weight:600; font-size:clamp(28px,4vw,40px); line-height:1.15; text-wrap:balance;}
.type-headline{font-family:var(--font-display); font-weight:600; font-size:26px; line-height:1.25; text-wrap:balance;}
.type-title-lg{font-family:var(--font-ui); font-weight:500; font-size:20px; line-height:1.3;}
.type-title-md{font-family:var(--font-ui); font-weight:500; font-size:16px; line-height:1.4;}
.type-title-sm{font-family:var(--font-ui); font-weight:500; font-size:14px; line-height:1.4;}
.type-body-lg{font-size:16px; line-height:1.55;}
.type-body-md{font-size:14px; line-height:1.5;}
.type-body-sm{font-size:12px; line-height:1.5;}
.type-label{font-size:12px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--md-on-surface-variant);}
.tnum{font-variant-numeric:tabular-nums;}

/* Focus */
:focus-visible{outline:2px solid var(--md-primary); outline-offset:2px; border-radius:4px;}

/* ============ App shell ============ */
#app{min-height:100vh; display:flex;}
.rail{
  width:96px; flex:none; background:var(--md-surface-low); border-right:1px solid var(--md-outline-variant);
  display:flex; flex-direction:column; align-items:center; gap:28px; padding:20px 8px; position:sticky; top:0; height:100vh;
}
.rail-brand{display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:12px;}
.rail-brand .mark{width:40px; height:40px; border-radius:var(--radius-md); background:var(--md-primary); color:var(--md-on-primary); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.rail-item{
  display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; cursor:pointer;
  color:var(--md-on-surface-variant); padding:6px 0; width:100%;
}
.rail-item .bubble{width:56px; height:32px; border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; transition:background .15s; overflow:hidden;}
.rail-item:hover .bubble{background:color-mix(in srgb, var(--md-on-surface) 8%, transparent);}
.rail-item.active .bubble{background:var(--md-secondary-container); color:var(--md-on-secondary-container);}
.rail-item.active{color:var(--md-on-surface);}
.rail-item span.lbl{font-size:12px; font-weight:500;}
.rail-spacer{flex:1;}

.shell{flex:1; min-width:0; display:flex; flex-direction:column; min-height:100vh;}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
  padding:14px 20px; background:color-mix(in srgb, var(--md-surface) 92%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--md-outline-variant);
}
.topbar .brand-mobile{display:none; align-items:center; gap:8px;}
.searchfield{
  flex:1; max-width:520px; display:flex; align-items:center; gap:10px;
  background:var(--md-surface-high); border-radius:var(--radius-full); padding:0 16px; height:44px;
  color:var(--md-on-surface-variant);
}
.searchfield input{
  border:none; background:none; outline:none; flex:1; font:inherit; font-size:15px; color:var(--md-on-surface);
}
.searchfield input::placeholder{color:var(--md-on-surface-variant);}
.topbar-spacer{flex:1;}
.icon-btn{
  width:40px; height:40px; border-radius:var(--radius-full); border:none; background:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--md-on-surface-variant); position:relative; flex:none;
  overflow:hidden;
}
.icon-btn:hover{background:color-mix(in srgb, var(--md-on-surface) 8%, transparent);}
.icon-btn.tonal{background:var(--md-secondary-container); color:var(--md-on-secondary-container);}
.icon-btn.tonal:hover{background:color-mix(in srgb, var(--md-secondary-container) 85%, var(--md-on-secondary-container));}

main{flex:1; padding:24px 28px 100px; max-width:1180px; width:100%; margin:0 auto;}
@media (max-width:640px){ main{padding:16px 16px 96px;} }

/* ============ Buttons ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; cursor:pointer;
  font-family:var(--font-ui); font-weight:500; font-size:14px; border-radius:var(--radius-full);
  height:40px; padding:0 24px; transition:box-shadow .15s, background .15s; white-space:nowrap;
}
.btn .icon{width:20px; height:20px;}
.btn-filled{background:var(--md-primary); color:var(--md-on-primary);}
.btn-filled:hover{box-shadow:var(--elev1);}
.btn-tonal{background:var(--md-secondary-container); color:var(--md-on-secondary-container);}
.btn-tonal:hover{box-shadow:var(--elev1);}
.btn-outlined{background:none; color:var(--md-primary); border:1px solid var(--md-outline);}
.btn-outlined:hover{background:color-mix(in srgb, var(--md-primary) 8%, transparent);}
.btn-text{background:none; color:var(--md-primary); padding:0 12px;}
.btn-text:hover{background:color-mix(in srgb, var(--md-primary) 8%, transparent);}
.btn-danger{background:var(--md-error); color:var(--md-on-error);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn-sm{height:32px; padding:0 16px; font-size:13px;}

/* ============ Chips ============ */
.chip{
  display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 14px; border-radius:var(--radius-full);
  border:1px solid var(--md-outline-variant); background:var(--md-surface); color:var(--md-on-surface-variant);
  font-size:13px; font-weight:500; cursor:pointer; user-select:none;
}
.chip .icon{width:16px; height:16px;}
.chip.selected{background:var(--md-secondary-container); color:var(--md-on-secondary-container); border-color:transparent;}
.chip.static{cursor:default;}
.chip.time{background:var(--md-tertiary-container); color:var(--md-on-tertiary-container); border-color:transparent;}
.chip.time.running{background:var(--md-primary); color:var(--md-on-primary);}
.chip.time.done{background:var(--md-primary-container); color:var(--md-on-primary-container);}
.chip.remove-x{padding-right:8px;}
.chip.remove-x button{background:none;border:none;color:inherit;display:flex;cursor:pointer;padding:0;margin-left:2px;}

/* ============ Cards / surfaces ============ */
.surface{background:var(--md-surface-cont); border-radius:var(--radius-lg);}
.card{
  background:var(--md-surface-low); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--elev1);
  display:flex; flex-direction:column; transition:box-shadow .15s;
}
.card:hover{box-shadow:var(--elev2);}

/* ============ Library ============ */
.page-header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px;}
.tagbar{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 22px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:20px;}
.recipe-card{cursor:pointer; position:relative;}
.recipe-photo{
  aspect-ratio:16/10; width:100%; position:relative; overflow:hidden; background:var(--md-surface-variant);
}
.recipe-photo img{width:100%; height:100%; object-fit:cover;}
.placeholder-photo{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:inherit;
}
.recipe-body{padding:16px; display:flex; flex-direction:column; gap:10px; flex:1;}
.recipe-title{font-family:var(--font-display); font-weight:600; font-size:19px; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.card-tags{display:flex; flex-wrap:wrap; gap:6px;}
.mini-tag{font-size:11px; font-weight:600; letter-spacing:.02em; padding:3px 9px; border-radius:var(--radius-full); background:var(--md-surface-high); color:var(--md-on-surface-variant);}
.meta-row{display:flex; align-items:center; gap:16px; color:var(--md-on-surface-variant); font-size:13px; margin-top:auto;}
.meta-row .item{display:flex; align-items:center; gap:5px;}
.meta-row .icon{width:17px; height:17px;}
.card-actions{position:absolute; top:10px; right:10px; display:flex; gap:6px;}
.card-actions .icon-btn{background:color-mix(in srgb, var(--md-surface-lowest) 78%, transparent); backdrop-filter:blur(4px); width:36px; height:36px;}
.empty-state{text-align:center; padding:70px 20px; color:var(--md-on-surface-variant);}
.empty-state .icon{width:56px; height:56px; opacity:.55; margin-bottom:12px;}

/* FAB */
.fab{
  position:fixed; right:28px; bottom:28px; z-index:30; height:56px; border-radius:var(--radius-lg);
  background:var(--md-primary-container); color:var(--md-on-primary-container); border:none; cursor:pointer;
  display:flex; align-items:center; gap:10px; padding:0 20px; box-shadow:var(--elev2); font-weight:500; font-size:14px;
}
.fab:hover{box-shadow:var(--elev3);}
@media (max-width:640px){ .fab{bottom:88px; right:16px; padding:0 16px;} .fab .fab-label{display:none;} }

/* Bottom nav (mobile) */
.bottom-nav{display:none;}
@media (max-width:1000px){
  .rail{display:none;}
  .bottom-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:25; height:72px;
    background:var(--md-surface-low); border-top:1px solid var(--md-outline-variant);
  }
  .bn-item{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:none; border:none; color:var(--md-on-surface-variant); cursor:pointer;}
  .bn-item .bubble{width:52px; height:28px; border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center;}
  .bn-item.active .bubble{background:var(--md-secondary-container); color:var(--md-on-secondary-container);}
  .bn-item.active{color:var(--md-on-surface);}
  .bn-item span.lbl{font-size:11px; font-weight:500;}
}

/* ============ Detail view ============ */
.detail-back{display:flex; align-items:center; gap:6px; margin-bottom:16px;}
.detail-hero{border-radius:var(--radius-xl); overflow:hidden; position:relative; background:var(--md-surface-variant); aspect-ratio:21/9; margin-bottom:22px;}
.detail-hero img{width:100%; height:100%; object-fit:cover;}
.detail-hero .placeholder-photo{aspect-ratio:auto; height:100%;}
.detail-heading{display:flex; flex-wrap:wrap; gap:18px; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
.detail-titlewrap{max-width:640px;}
.detail-desc{color:var(--md-on-surface-variant); margin-top:8px;}
.detail-actions{display:flex; gap:8px; flex:none;}
.detail-meta{display:flex; flex-wrap:wrap; gap:10px; margin:16px 0 6px;}
.detail-tags{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 26px;}

.detail-grid{display:grid; grid-template-columns:minmax(280px,380px) 1fr; gap:36px; align-items:start;}
@media (max-width:860px){ .detail-grid{grid-template-columns:1fr;} }

.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.servings-control{display:flex; align-items:center; gap:14px; background:var(--md-surface-cont); border-radius:var(--radius-lg); padding:12px 16px; margin-bottom:18px;}
.stepper-btn{width:36px; height:36px; border-radius:var(--radius-full); border:1px solid var(--md-outline); background:var(--md-surface-lowest); color:var(--md-on-surface); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden;}
.stepper-btn:hover{background:var(--md-surface-high);}
.servings-num{font-size:22px; font-weight:600; min-width:2ch; text-align:center;}
.scale-note{font-size:12px; color:var(--md-on-surface-variant);}

.ing-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column;}
.ing-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--md-outline-variant);}
.ing-row:last-child{border-bottom:none;}
.ing-qty-field{
  width:76px; flex:none; height:38px; border-radius:var(--radius-sm); border:1px solid var(--md-outline);
  background:var(--md-surface-lowest); color:var(--md-on-surface); text-align:right; padding:0 10px; font:inherit; font-weight:600;
  font-variant-numeric:tabular-nums;
}
.ing-qty-field:focus{border-color:var(--md-primary); border-width:2px; padding:0 9px;}
.ing-unit{width:52px; flex:none; color:var(--md-on-surface-variant); font-size:13px;}
.ing-name{flex:1;}
.ing-note{color:var(--md-on-surface-variant); font-size:12px; display:block;}

.steps-list{list-style:none; margin:0; padding:0; counter-reset:step; display:flex; flex-direction:column; gap:4px;}
.step-row{display:flex; gap:14px; padding:14px 4px; border-bottom:1px solid var(--md-outline-variant);}
.step-row:last-child{border-bottom:none;}
.step-check{width:30px; height:30px; border-radius:var(--radius-full); border:2px solid var(--md-outline); background:none; color:transparent; flex:none; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-top:2px; overflow:hidden;}
.step-check.done{background:var(--md-primary); border-color:var(--md-primary); color:var(--md-on-primary);}
.step-body{flex:1;}
.step-text{margin-bottom:8px;}
.step-row.done .step-text{color:var(--md-on-surface-variant); text-decoration:line-through;}
.step-num{font-family:var(--font-display); font-weight:600; color:var(--md-on-surface-variant); font-size:15px; width:22px; flex:none; text-align:right;}

/* ============ Forms (editor) ============ */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:18px;}
.field label{font-size:12px; font-weight:500; color:var(--md-on-surface-variant);}
.field input[type=text], .field input[type=number], .field input[type=url], .field textarea{
  border:1px solid var(--md-outline); border-radius:var(--radius-sm); background:var(--md-surface-lowest);
  color:var(--md-on-surface); font:inherit; font-size:15px; padding:12px 14px; width:100%; resize:vertical;
}
.field input:focus, .field textarea:focus{border-color:var(--md-primary); border-width:2px; padding:11px 13px;}
.field textarea{min-height:120px; line-height:1.5;}
.field .hint{font-size:12px; color:var(--md-on-surface-variant);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:560px){ .two-col{grid-template-columns:1fr;} }

.photo-drop{
  border:1.5px dashed var(--md-outline); border-radius:var(--radius-lg); aspect-ratio:16/7; display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:8px; color:var(--md-on-surface-variant);
  cursor:pointer; background:var(--md-surface-cont); overflow:hidden; position:relative; margin-bottom:20px;
}
.photo-drop img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.photo-drop .remove-photo{position:absolute; top:8px; right:8px;}

.builder-row{display:flex; gap:10px; align-items:flex-start; margin-bottom:10px;}
.builder-row .grow{flex:1;}
.builder-row input, .builder-row textarea{
  border:1px solid var(--md-outline); border-radius:var(--radius-sm); background:var(--md-surface-lowest);
  color:var(--md-on-surface); font:inherit; font-size:14px; padding:10px 12px; width:100%;
}
.builder-row .qty-in{width:76px; flex:none;}
.builder-row .unit-in{width:92px; flex:none;}
.builder-row .min-in{width:88px; flex:none;}
.row-remove{flex:none; margin-top:2px;}
.add-row-btn{margin-top:4px;}
.form-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:28px; padding-top:20px; border-top:1px solid var(--md-outline-variant);}
.err-text{color:var(--md-error); font-size:13px; margin-top:-8px; margin-bottom:14px;}

.tag-input-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; border:1px solid var(--md-outline); border-radius:var(--radius-sm); padding:8px 10px; background:var(--md-surface-lowest);}
.tag-input-row input{border:none; outline:none; background:none; flex:1; min-width:120px; font:inherit; font-size:14px; padding:4px;}
.suggested-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}

/* ============ Import ============ */
.segmented{display:inline-flex; border:1px solid var(--md-outline); border-radius:var(--radius-full); padding:3px; margin-bottom:20px;}
.segmented button{border:none; background:none; padding:8px 20px; border-radius:var(--radius-full); font-weight:500; font-size:14px; color:var(--md-on-surface-variant); cursor:pointer; display:flex; align-items:center; gap:6px;}
.segmented button.active{background:var(--md-secondary-container); color:var(--md-on-secondary-container);}
.banner{display:flex; gap:12px; align-items:flex-start; background:var(--md-tertiary-container); color:var(--md-on-tertiary-container); border-radius:var(--radius-md); padding:14px 16px; margin:16px 0; font-size:13px;}
.banner .icon{flex:none;}
.parse-preview{margin-top:26px;}
.preview-row{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--md-outline-variant); font-size:14px;}
.preview-row:last-child{border-bottom:none;}
.preview-row .k{width:110px; flex:none; color:var(--md-on-surface-variant); font-size:12px; text-transform:uppercase; letter-spacing:.05em; padding-top:2px;}
.spinner{width:22px; height:22px; border-radius:50%; border:2.5px solid var(--md-outline-variant); border-top-color:var(--md-primary); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){ .spinner{animation:none; border-top-color:var(--md-outline-variant); border-right-color:var(--md-primary);} }

/* ============ Dialog & Snackbar ============ */
.scrim{position:fixed; inset:0; background:color-mix(in srgb, var(--md-scrim) 40%, transparent); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px;}
.dialog{background:var(--md-surface-cont); border-radius:var(--radius-xl); padding:24px; max-width:420px; width:100%; box-shadow:var(--elev3);}
.dialog .icon-lead{width:28px; height:28px; color:var(--md-error); margin-bottom:12px;}
.dialog h3{font-family:var(--font-ui); font-size:20px; font-weight:500; margin-bottom:10px;}
.dialog p{color:var(--md-on-surface-variant); font-size:14px; line-height:1.5;}
.dialog-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:22px;}

.snackbar-root{position:fixed; left:20px; bottom:20px; z-index:60; display:flex; flex-direction:column; gap:8px;}
@media (max-width:1000px){ .snackbar-root{left:16px; right:16px; bottom:88px;} }
.snackbar{
  background:var(--md-on-surface); color:var(--md-surface); border-radius:var(--radius-sm); padding:14px 16px;
  display:flex; align-items:center; gap:16px; box-shadow:var(--elev3); font-size:14px; min-width:280px; max-width:420px;
  animation:snack-in .18s ease-out;
}
@keyframes snack-in{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.snackbar button{background:none; border:none; color:var(--md-primary); filter:brightness(1.4); font-weight:600; font-size:13px; cursor:pointer; flex:none;}

/* ============ Theme popover ============ */
.theme-menu-wrap{position:relative;}
.popover{
  position:absolute; top:calc(100% + 8px); right:0; z-index:40; width:280px;
  background:var(--md-surface-high); border-radius:var(--radius-lg); box-shadow:var(--elev3);
  padding:16px; display:flex; flex-direction:column; gap:16px;
}
.popover-section{display:flex; flex-direction:column; gap:10px;}
.seg3{display:flex; background:var(--md-surface-cont); border-radius:var(--radius-full); padding:3px; gap:2px;}
.seg3 button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; border:none; background:none;
  border-radius:var(--radius-full); color:var(--md-on-surface-variant); cursor:pointer; font-size:11px; font-weight:500;
}
.seg3 button .icon{width:18px; height:18px;}
.seg3 button.active{background:var(--md-surface-lowest); color:var(--md-primary); box-shadow:var(--elev1);}
.swatch-row{display:flex; flex-wrap:wrap; gap:10px;}
.swatch{
  width:34px; height:34px; border-radius:var(--radius-full); border:2px solid transparent; cursor:pointer; padding:0;
  display:flex; align-items:center; justify-content:center; position:relative;
}
.swatch.active{border-color:var(--md-on-surface);}
.swatch.active::after{content:''; position:absolute; inset:-5px; border-radius:var(--radius-full); border:1.5px solid var(--md-on-surface);}
.swatch .icon{width:16px; height:16px; color:#fff; filter:drop-shadow(0 0 1px rgba(0,0,0,.5));}
.custom-swatch{
  background:conic-gradient(from 180deg,#ff5252,#ffca28,#66bb6a,#26c6da,#5c6bc0,#ab47bc,#ff5252);
  position:relative; overflow:hidden;
}
.custom-swatch input[type=color]{
  position:absolute; inset:-4px; width:calc(100% + 8px); height:calc(100% + 8px); border:none; padding:0; cursor:pointer; opacity:0;
}
</style>
</head>

function parseQty(str){
  if(str === undefined || str === null) return 0;
  str = String(str).trim();
  if(!str) return 0;
  let m = str.match(/^(\d+)\s+([¼½¾⅓⅔⅛⅜⅝⅞⅕⅖⅗⅘⅙⅚])$/);
  if(m) return parseInt(m[1],10) + UNI_FRAC[m[2]];
  if(UNI_FRAC[str] !== undefined) return UNI_FRAC[str];
  m = str.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if(m) return parseInt(m[1],10) + parseInt(m[2],10)/parseInt(m[3],10);
  m = str.match(/^(\d+)\/(\d+)$/);
  if(m) return parseInt(m[1],10)/parseInt(m[2],10);
  const f = parseFloat(str);
  return isNaN(f) ? 0 : f;
}

const FRAC_TABLE = [[1/8,'⅛'],[1/6,'⅙'],[1/5,'⅕'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[2/5,'⅖'],[1/2,'½'],[3/5,'⅗'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[4/5,'⅘'],[5/6,'⅚'],[7/8,'⅞']];
function formatQty(n){
  if(!n || n <= 0) return '—';
  const whole = Math.floor(n + 1e-6);
  const frac = n - whole;
  if(frac < 0.02) return String(whole);
  if(frac > 0.98) return String(whole + 1);
  let best=null, bd=1;
  for(const [v,s] of FRAC_TABLE){ const d = Math.abs(frac - v); if(d < bd){ bd = d; best = s; } }
  if(bd < 0.03) return (whole > 0 ? whole + ' ' : '') + best;
  const r = Math.round(n * 100) / 100;
  return String(r);
}
function formatMinutes(total){
  if(!total) return '';
  const h = Math.floor(total/60), m = total % 60;
  if(h && m) return h + 'h ' + m + 'm';
  if(h) return h + 'h';
  return m + ' min';
}
function totalRecipeTime(recipe){
  return recipe.instructions.reduce((sum,s) => sum + (s.timeMinutes || 0), 0);
}
function allTags(){
  const s = new Set();

/* ============================================================
   Ingredient / instruction line parsing (paste-to-recipe)
   ============================================================ */
function stripBullet(line){ return line.replace(/^[\-•*•‣◦]\s*/, '').replace(/^\d+[\.\)]\s*/, '').trim(); }

function parseIngredientLine(raw){
  const line = stripBullet(raw);
  const qtyUnitRe = /^([\d¼½¾⅓⅔⅛⅜⅝⅞⅕⅖⅗⅘⅙⅚][\d¼½¾⅓⅔⅛⅜⅝⅞⅕⅖⅗⅘⅙⅚\/\.\s]*)\s+([a-zA-Z]+\.?)?\s*(.*)$/;
  const m = line.match(qtyUnitRe);
  if(m){
    const qty = parseQty(m[1].trim());
    let unit = '', name = '';
    if(m[2] && UNIT_RE.test(m[2].replace(/\.$/,''))){
      unit = m[2].replace(/\.$/,'').toLowerCase();
      name = m[3].trim();
    } else {
      name = ((m[2] || '') + ' ' + (m[3] || '')).trim();
    }
    name = name.replace(/^of\s+/i, '').trim();
    return { name: name || line, qty, unit };
  }
  return { name: line, qty: 0, unit: '' };
}

function parseStepLine(raw){
  const text = stripBullet(raw);
  let timeMinutes = null;
  const hourM = text.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)\b/i);
  const minM = text.match(/(\d+)\s*(?:minutes?|mins?)\b/i);
  if(hourM || minM){
    timeMinutes = (hourM ? Math.round(parseFloat(hourM[1]) * 60) : 0) + (minM ? parseInt(minM[1],10) : 0);
  }
  return { text, timeMinutes };
}

function parseRecipeText(raw){
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  if(!lines.length) return null;

  let title = '';
  let bodyStart = 0;
  if(lines[0].length <= 90 && !/^ingredients?:?$/i.test(lines[0])){
    title = lines[0];
    bodyStart = 1;
  }

  const ingHeaderRe = /^ingredients?\s*:?$/i;
  const stepHeaderRe = /^(instructions?|directions?|method|steps|preparation)\s*:?$/i;

  let ingLines = [], stepLines = [];
  let mode = 'scan';
  for(let i = bodyStart; i < lines.length; i++){
    const l = lines[i];
    if(ingHeaderRe.test(l)){ mode = 'ing'; continue; }
    if(stepHeaderRe.test(l)){ mode = 'step'; continue; }
    if(mode === 'ing') ingLines.push(l);
    else if(mode === 'step') stepLines.push(l);
    else {
      const looksIngredient = /^[\-•*]\s/.test(l) || /^[\d¼½¾⅓⅔⅛⅜⅝⅞⅕⅖⅗⅘⅙⅚]/.test(l);
      const looksStep = /^\d+[\.\)]\s/.test(l);
      if(looksStep) stepLines.push(l);
      else if(looksIngredient) ingLines.push(l);
    }
  }
  if(!ingLines.length && !stepLines.length){
    // last-resort split: first half ingredients, second half steps
    const rest = lines.slice(bodyStart);
    const mid = Math.ceil(rest.length / 2);
    ingLines = rest.slice(0, mid);
    stepLines = rest.slice(mid);
  }

  const ingredients = ingLines.map(parseIngredientLine).filter(i => i.name);
  const instructions = stepLines.map(parseStepLine).filter(s => s.text);

  const servM = raw.match(/serv(?:es|ings)?\s*[:\-]?\s*(\d+)/i) || raw.match(/yield[s]?\s*[:\-]?\s*(\d+)/i);
  const baseServings = servM ? parseInt(servM[1],10) : 4;

  const lower = raw.toLowerCase();
  const suggestedTags = Object.keys(KEYWORD_TAGS).filter(k => lower.includes(k)).map(k => KEYWORD_TAGS[k]);

  return {
    title: title || 'Imported Recipe',
    description: '',
    photo: null,
    tags: Array.from(new Set(suggestedTags)),
    baseServings,
    ingredients: ingredients.length ? ingredients : [{name:'', qty:0, unit:''}],
    instructions: instructions.length ? instructions : [{text:'', timeMinutes:null}]
  };
}

function filteredRecipes(){
  const q = searchQuery.trim().toLowerCase();
  return recipes.filter(r => {
    if(activeTagFilters.size && !r.tags.some(t => activeTagFilters.has(t))) return false;
    if(!q) return true;
    if(r.title.toLowerCase().includes(q)) return true;
    if(r.description.toLowerCase().includes(q)) return true;
    if(r.tags.some(t => t.toLowerCase().includes(q))) return true;
    if(r.ingredients.some(i => i.name.toLowerCase().includes(q))) return true;
    return false;
  });

function formatClock(totalSeconds){
  const h = Math.floor(totalSeconds/3600), m = Math.floor((totalSeconds%3600)/60), s = totalSeconds%60;
  if(h) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  return m + ':' + String(s).padStart(2,'0');
}

function renderTimerChip(key, minutes, idx){
  const t = stepTimers.get(key) || { remaining: minutes*60, running:false, total: minutes*60 };
  stepTimers.set(key, t);
  const done = t.remaining <= 0;
  const label = done ? 'Done' : formatClock(t.remaining);
  const iconName = done ? 'check_circle' : (t.running ? 'pause' : 'play_arrow');
  const showReset = t.running || t.remaining < t.total;
  return `<div style="display:flex; align-items:center; gap:8px; margin-top:2px;">
    <button class="chip time ${t.running?'running':''} ${done?'done':''}" data-action="toggle-timer" data-idx="${idx}" id="timer-chip-${idx}">
      <span id="timer-icon-${idx}">${iconMarkup(iconName,'icon-sm')}</span><span class="tnum" id="timer-label-${idx}">${label}</span>
    </button>
    ${showReset ? `<button class="icon-btn" style="width:32px;height:32px;" data-action="reset-timer" data-idx="${idx}" aria-label="Reset timer">${iconMarkup('restart_alt','icon-sm')}</button>` : ''}

}

/* ============================================================
   Theme — explicit light/dark/system + Material-You-style dynamic color
   ============================================================ */
function hexToRgb(hex){
  hex = String(hex).replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v => clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
}
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0, s=0; const l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=(g-b)/d+(g<b?6:0); break;
      case g: h=(b-r)/d+2; break;
      default: h=(r-g)/d+4;
    }
    h/=6;
  }
  return { h:h*360, s:s*100, l:l*100 };
}
function hslToHex(h,s,l){
  h=((h%360)+360)%360; s=clamp(s,0,100)/100; l=clamp(l,0,100)/100;
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs((h/60)%2-1));
  const m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return rgbToHex((r+m)*255,(g+m)*255,(b+m)*255);
}
function relLuminance(hex){
  const {r,g,b} = hexToRgb(hex);
  const lin = v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function pickOnColor(bgHex){
  return relLuminance(bgHex) > 0.42 ? '#15170F' : '#FBFCF6';
}

function buildPalette(seedHex, dark){
  const seedRgb = hexToRgb(seedHex);
  const seedHsl = rgbToHsl(seedRgb.r, seedRgb.g, seedRgb.b);
  const H = seedHsl.h, H2 = H + 60;
  const S = Math.max(seedHsl.s, 20);
  const primaryS = clamp(S,32,78), secondaryS = clamp(S*0.42,14,34), tertiaryS = clamp(S,28,68);
  const neutralS = clamp(S*0.055,2,7), neutralVariantS = clamp(S*0.13,4,15);
  const mk = (hue,sat,light) => hslToHex(hue,sat,light);

  const roles = !dark ? {
    primary: mk(H,primaryS,39), primaryContainer: mk(H,primaryS*0.85,90),
    secondary: mk(H,secondaryS,33), secondaryContainer: mk(H,secondaryS,88),
    tertiary: mk(H2,tertiaryS,40), tertiaryContainer: mk(H2,tertiaryS*0.85,90),
    error: '#BA1A1A', errorContainer: '#FFDAD6',
    background: mk(H,neutralS,97.5), surface: mk(H,neutralS,97.5),
    surfaceVariant: mk(H,neutralVariantS,89), outline: mk(H,neutralVariantS*1.3,48), outlineVariant: mk(H,neutralVariantS,83),
    surfaceLowest: mk(H,neutralS*0.5,100), surfaceLow: mk(H,neutralS,95.5),
    surfaceCont: mk(H,neutralS,93.5), surfaceHigh: mk(H,neutralS,91.5), surfaceHighest: mk(H,neutralS,89.5),
    onBackground: mk(H,neutralVariantS*0.5,13), onSurface: mk(H,neutralVariantS*0.5,13), onSurfaceVariant: mk(H,neutralVariantS*1.1,31),
    shadow: `${Math.round(H)} 25% 15%`
  } : {
    primary: mk(H,primaryS,79), primaryContainer: mk(H,primaryS*0.75,28),
    secondary: mk(H,secondaryS,74), secondaryContainer: mk(H,secondaryS,27),
    tertiary: mk(H2,tertiaryS,80), tertiaryContainer: mk(H2,tertiaryS*0.75,28),
    error: '#FFB4AB', errorContainer: '#93000A',
    background: mk(H,neutralS*1.5,7), surface: mk(H,neutralS*1.5,7),
    surfaceVariant: mk(H,neutralVariantS,28), outline: mk(H,neutralVariantS*1.2,59), outlineVariant: mk(H,neutralVariantS,30),
    surfaceLowest: mk(H,neutralS*1.5,4), surfaceLow: mk(H,neutralS*1.5,10),
    surfaceCont: mk(H,neutralS*1.5,12.5), surfaceHigh: mk(H,neutralS*1.5,17.5), surfaceHighest: mk(H,neutralS*1.5,22.5),
    onBackground: mk(H,neutralVariantS*0.4,90), onSurface: mk(H,neutralVariantS*0.4,90), onSurfaceVariant: mk(H,neutralVariantS,79),
    shadow: `${Math.round(H)} 40% 2%`
  };

  return {
    '--md-primary':roles.primary, '--md-on-primary':pickOnColor(roles.primary),
    '--md-primary-container':roles.primaryContainer, '--md-on-primary-container':pickOnColor(roles.primaryContainer),
    '--md-secondary':roles.secondary, '--md-on-secondary':pickOnColor(roles.secondary),
    '--md-secondary-container':roles.secondaryContainer, '--md-on-secondary-container':pickOnColor(roles.secondaryContainer),
    '--md-tertiary':roles.tertiary, '--md-on-tertiary':pickOnColor(roles.tertiary),
    '--md-tertiary-container':roles.tertiaryContainer, '--md-on-tertiary-container':pickOnColor(roles.tertiaryContainer),
    '--md-error':roles.error, '--md-on-error':pickOnColor(roles.error),
    '--md-error-container':roles.errorContainer, '--md-on-error-container':pickOnColor(roles.errorContainer),
    '--md-background':roles.background, '--md-on-background':roles.onBackground,
    '--md-surface':roles.surface, '--md-on-surface':roles.onSurface,
    '--md-surface-variant':roles.surfaceVariant, '--md-on-surface-variant':roles.onSurfaceVariant,
    '--md-outline':roles.outline, '--md-outline-variant':roles.outlineVariant,
    '--md-surface-lowest':roles.surfaceLowest, '--md-surface-low':roles.surfaceLow,
    '--md-surface-cont':roles.surfaceCont, '--md-surface-high':roles.surfaceHigh, '--md-surface-highest':roles.surfaceHighest,
    '--md-shadow-color':roles.shadow
  };
}

const THEME_PRESETS = [
  {name:'Basil', hex:'#2F6B3F'},
  {name:'Ocean', hex:'#1B6EC2'},
  {name:'Plum', hex:'#83447A'},
  {name:'Saffron', hex:'#C77800'},
  {name:'Clay', hex:'#A6543A'},
  {name:'Slate', hex:'#55617A'}
];
const DEFAULT_SEED = THEME_PRESETS[0].hex;

function loadThemeState(){
  try{
    const raw = localStorage.getItem(THEME_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.mode) return { mode:parsed.mode, seed:parsed.seed || DEFAULT_SEED }; }
  }catch(e){}
  return { mode:'system', seed:DEFAULT_SEED };
}
function saveThemeState(){ try{ localStorage.setItem(THEME_KEY, JSON.stringify(themeState)); }catch(e){} }

let themeState = loadThemeState();
let themeMenuOpen = false;

function effectiveDark(){
  if(themeState.mode === 'dark') return true;
  if(themeState.mode === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function applyTheme(){
  const dark = effectiveDark();
  const vars = buildPalette(themeState.seed, dark);
  const rootStyle = document.documentElement.style;
  Object.entries(vars).forEach(([k,v]) => rootStyle.setProperty(k,v));
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  applyThemeIcon();
}
function applyThemeIcon(){
  const name = themeState.mode === 'light' ? 'light_mode' : themeState.mode === 'dark' ? 'dark_mode' : 'routine';
  const el = document.getElementById('theme-icon');
  if(el) el.innerHTML = iconMarkup(name);
  const btn = document.getElementById('theme-toggle');
  if(btn) btn.setAttribute('aria-label', 'Appearance: ' + themeState.mode + '. Activate to change.');
}
function setThemeMode(mode){ themeState.mode = mode; saveThemeState(); applyTheme(); renderThemePopover(); }
function setThemeSeed(hex){ themeState.seed = hex; saveThemeState(); applyTheme(); renderThemePopover(); }
function setThemeSeedLive(hex){
  // used while dragging the native color picker — avoid rebuilding the popover
  // DOM (which would tear down the open picker), just repaint the palette.
  themeState.seed = hex; saveThemeState(); applyTheme();
  document.querySelectorAll('.swatch:not(.custom-swatch)').forEach(sw => sw.innerHTML = '');
}
function toggleThemeMenu(force){
  themeMenuOpen = force !== undefined ? force : !themeMenuOpen;
  const btn = document.getElementById('theme-toggle');
  if(btn) btn.setAttribute('aria-expanded', String(themeMenuOpen));
  renderThemePopover();
}
function renderThemePopover(){
  const root = document.getElementById('theme-popover');
  if(!root) return;
  if(!themeMenuOpen){ root.classList.remove('popover'); root.innerHTML=''; return; }
  root.classList.add('popover');
  const modes = [['system','routine','System'],['light','light_mode','Light'],['dark','dark_mode','Dark']];
  root.innerHTML = `
    <div class="popover-section">
      <span class="type-label">Appearance</span>
      <div class="seg3">
        ${modes.map(([m,ic,label]) => `<button type="button" data-action="set-theme-mode" data-mode="${m}" class="${themeState.mode===m?'active':''}">${iconMarkup(ic)}${label}</button>`).join('')}
      </div>
    </div>
    <div class="popover-section">
      <span class="type-label">Dynamic color</span>
      <div class="swatch-row">
        ${THEME_PRESETS.map(p => `<button type="button" class="swatch" style="background:${p.hex};" data-action="set-theme-seed" data-seed="${p.hex}" aria-label="${p.name}" title="${p.name}">${themeState.seed.toLowerCase()===p.hex.toLowerCase()?iconMarkup('check'):''}</button>`).join('')}
        <label class="swatch custom-swatch" title="Custom color" aria-label="Custom color">
          <input type="color" id="seed-picker" value="${themeState.seed}" data-field="seed-custom" />
        </label>
      </div>
    </div>`;
}

/* ============================================================
   Timers
   ============================================================ */
function clearAllStepTimers(){
  stepTimers.forEach(t => {});
  stepTimers.clear();
  if(timerTick){ clearInterval(timerTick); timerTick = null; }
}
function ensureTicker(){
  if(timerTick) return;
  timerTick = setInterval(() => {
    let anyRunning = false;
    stepTimers.forEach((t, key) => {
      if(t.running && t.remaining > 0){
        t.remaining -= 1;
        anyRunning = true;
        if(t.remaining <= 0){ t.running = false; }
        const idx = key.split('-').pop();
        const labelEl = document.getElementById('timer-label-' + idx);
        const chipEl = document.getElementById('timer-chip-' + idx);
        if(labelEl){
          const done = t.remaining <= 0;
          labelEl.textContent = done ? 'Done' : formatClock(t.remaining);
          if(chipEl){
            chipEl.classList.toggle('done', done);
            if(done){
              chipEl.classList.remove('running');
              const iconSlot = document.getElementById('timer-icon-' + idx);
              if(iconSlot) iconSlot.innerHTML = iconMarkup('check_circle','icon-sm');
            }
          }
        }
      }
    });
    if(!anyRunning){ clearInterval(timerTick); timerTick = null; }
  }, 1000);
}

/* ============================================================
   Navigation / actions
   ============================================================ */
function goLibrary(){ view = 'library'; currentRecipeId = null; render(); }
function openRecipe(id){ currentRecipeId = id; view = 'detail'; render(); window.scrollTo({top:0}); }
function startNewRecipe(origin){
  editorOrigin = origin || 'library';
  editorError = '';
  editorDraft = { id: uid(), title:'', description:'', photo:null, tags:[], baseServings:4,
    ingredients:[{name:'',qty:0,unit:''}], instructions:[{text:'',timeMinutes:null}] };
  view = 'editor'; render(); window.scrollTo({top:0});
}
function startEditRecipe(id, origin){
  const r = recipes.find(x => x.id === id);
  if(!r) return;
  editorOrigin = origin || 'detail';
  editorError = '';
  editorDraft = JSON.parse(JSON.stringify(r));
  view = 'editor'; render(); window.scrollTo({top:0});
}
function loadDraftFromParsed(parsed){
  editorOrigin = 'import';
  editorError = '';
  editorDraft = { id: uid(), title:parsed.title, description:parsed.description||'', photo:null,
    tags:parsed.tags.slice(), baseServings:parsed.baseServings,
    ingredients: parsed.ingredients.map(i=>({name:i.name,qty:i.qty,unit:i.unit||''})),
    instructions: parsed.instructions.map(s=>({text:s.text,timeMinutes:s.timeMinutes||null})) };
  view = 'editor'; render(); window.scrollTo({top:0});
}

function confirmDeleteRecipe(id){
  const r = recipes.find(x => x.id === id);
  if(!r) return;
  openDialog(`
    ${iconMarkup('warning','icon-lead')}
    <h3>Delete "${escapeHtml(r.title)}"?</h3>
    <p>This can't be undone from here, though you'll get a moment to undo right after.</p>
    <div class="dialog-actions">
      <button class="btn btn-text" data-action="cancel-delete">Cancel</button>
      <button class="btn btn-danger" data-action="confirm-delete" data-id="${r.id}">Delete</button>
    </div>`);
}
function doDelete(id){
  const idx = recipes.findIndex(r => r.id === id);
  if(idx === -1) return;
  lastDeleted = { recipe: recipes[idx], index: idx };
  recipes.splice(idx, 1);
  closeDialog();
  if(currentRecipeId === id) goLibrary(); else render();
  persist(recipes);
  showSnackbar('Recipe deleted', 'Undo', () => {
    if(lastDeleted){ recipes.splice(lastDeleted.index, 0, lastDeleted.recipe); persistAndRender(); lastDeleted = null; }
  });
}

function saveRecipe(){
  const d = editorDraft;
  const title = d.title.trim();
  if(!title){ editorError = 'Give this recipe a title before saving.'; render(); document.getElementById('f-title').focus(); return; }
  d.title = title;
  d.baseServings = Math.max(1, parseInt(d.baseServings,10) || 1);
  d.ingredients = d.ingredients.filter(i => i.name && i.name.trim());
  d.instructions = d.instructions.filter(s => s.text && s.text.trim());
  if(!d.ingredients.length){ editorError = 'Add at least one ingredient.'; render(); return; }
  if(!d.instructions.length){ editorError = 'Add at least one step.'; render(); return; }
  d.updatedAt = Date.now();
  const existingIdx = recipes.findIndex(r => r.id === d.id);
  if(existingIdx === -1){ d.createdAt = Date.now(); recipes.push(d); }
  else recipes[existingIdx] = d;
  persist(recipes);
  currentRecipeId = d.id;
  view = 'detail';
  editorDraft = null; editorError = '';
  render(); window.scrollTo({top:0});
  showSnackbar(existingIdx === -1 ? 'Recipe created' : 'Recipe saved');
}
function cancelEdit(){
  const backTo = editorOrigin;
  editorDraft = null; editorError = '';
  if(backTo === 'detail' && currentRecipeId){ view = 'detail'; }
  else if(backTo === 'import'){ view = 'import'; }
  else { view = 'library'; }
  render();
}

function runImport(){
  const s = importState;
  s.loading = true; s.parsed = null; render();
  const delay = s.mode === 'link' ? 900 : 350;
  setTimeout(() => {
    if(s.mode === 'text'){
      s.parsed = parseRecipeText(s.text);
    } else {
      const demo = DEMO_LINK_RECIPES[hashStr(s.link.trim()) % DEMO_LINK_RECIPES.length];
      s.parsed = JSON.parse(JSON.stringify(demo));
    }
    s.loading = false;
    render();
  }, delay);
}

/* ============================================================
   Event delegation
   ============================================================ */
document.addEventListener('click', (e) => {
  if(themeMenuOpen && !e.target.closest('.theme-menu-wrap')) toggleThemeMenu(false);
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case 'nav': {
      const v = el.dataset.view;
      if(v === 'library') goLibrary();
      else { view = 'import'; importState.parsed=null; importState.loading=false; render(); }
      break;
    }
    case 'open-recipe': openRecipe(el.dataset.id); break;
    case 'new-recipe': startNewRecipe(view); break;
    case 'edit-recipe': startEditRecipe(el.dataset.id, view === 'detail' ? 'detail' : 'library'); break;
    case 'delete-recipe': confirmDeleteRecipe(el.dataset.id); break;
    case 'confirm-delete': doDelete(el.dataset.id); break;
    case 'cancel-delete': closeDialog(); break;
    case 'back-to-library': goLibrary(); break;
    case 'toggle-tag-filter': {
      const t = el.dataset.tag;
      if(activeTagFilters.has(t)) activeTagFilters.delete(t); else activeTagFilters.add(t);
      render();
      break;
    }
    case 'servings-inc': {
      detailState.servings = clamp(Math.round(detailState.servings) + 1, 1, 999);
      render();
      break;
    }
    case 'servings-dec': {
      detailState.servings = clamp(Math.round(detailState.servings) - 1, 1, 999);
      render();
      break;
    }
    case 'toggle-step': {
      const idx = parseInt(el.dataset.idx,10);
      if(detailState.completedSteps.has(idx)) detailState.completedSteps.delete(idx); else detailState.completedSteps.add(idx);
      render();
      break;
    }
    case 'toggle-timer': {
      const recipe = recipes.find(r => r.id === currentRecipeId);
      const idx = parseInt(el.dataset.idx,10);
      const key = recipe.id + '-' + idx;
      const step = recipe.instructions[idx];
      let t = stepTimers.get(key);
      if(!t){ t = { remaining: step.timeMinutes*60, running:false, total: step.timeMinutes*60 }; stepTimers.set(key, t); }
      if(t.remaining <= 0) break;
      t.running = !t.running;
      if(t.running) ensureTicker();
      render();
      break;
    }
    case 'reset-timer': {
      const recipe = recipes.find(r => r.id === currentRecipeId);
      const idx = parseInt(el.dataset.idx,10);
      const key = recipe.id + '-' + idx;
      const step = recipe.instructions[idx];
      stepTimers.set(key, { remaining: step.timeMinutes*60, running:false, total: step.timeMinutes*60 });
      render();
      break;
    }
    case 'toggle-theme-menu': toggleThemeMenu(); break;
    case 'set-theme-mode': setThemeMode(el.dataset.mode); break;
    case 'set-theme-seed': setThemeSeed(el.dataset.seed); break;
    case 'pick-photo': document.getElementById('photo-file-input').click(); break;
    case 'remove-photo': e.preventDefault(); editorDraft.photo = null; render(); break;
    case 'add-ingredient-row': editorDraft.ingredients.push({name:'',qty:0,unit:''}); render(); break;
    case 'remove-ingredient-row': editorDraft.ingredients.splice(parseInt(el.dataset.idx,10),1); render(); break;
    case 'add-step-row': editorDraft.instructions.push({text:'',timeMinutes:null}); render(); break;
    case 'remove-step-row': editorDraft.instructions.splice(parseInt(el.dataset.idx,10),1); render(); break;
    case 'remove-tag': editorDraft.tags = editorDraft.tags.filter(t => t !== el.dataset.tag); render(); break;
    case 'add-tag-suggestion': if(!editorDraft.tags.includes(el.dataset.tag)) editorDraft.tags.push(el.dataset.tag); render(); break;
    case 'save-recipe': saveRecipe(); break;
    case 'cancel-edit': cancelEdit(); break;
    case 'switch-import-tab': importState.mode = el.dataset.tab; importState.parsed=null; importState.loading=false; render(); break;
    case 'run-import': runImport(); break;
    case 'import-use-editor': loadDraftFromParsed(importState.parsed); break;
    case 'import-save-direct': {
      loadDraftFromParsed(importState.parsed);
      saveRecipe();
      break;
    }
    case 'import-start-over': importState = {mode:importState.mode, text:'', link:'', parsed:null, loading:false}; render(); break;
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if(t.dataset.actionInput === 'scale-ingredient'){
    const recipe = recipes.find(r => r.id === currentRecipeId);
    const idx = parseInt(t.dataset.idx,10);
    const ing = recipe.ingredients[idx];
    if(ing.qty > 0){
      const entered = parseQty(t.value);
      if(entered > 0){
        const newScale = entered / ing.qty;
        detailState.servings = recipe.baseServings * newScale;
      }
    }
    // live-update sibling rows without full re-render (preserve focus)
    const scale = recipe.baseServings > 0 ? (detailState.servings / recipe.baseServings) : 1;
    document.querySelectorAll('.ing-qty-field').forEach((input, i) => {
      if(i === idx) return;
      const other = recipe.ingredients[i];
      if(other.qty > 0) input.value = formatQty(other.qty * scale);
    });
    const servEl = document.querySelector('.servings-num');
    if(servEl) servEl.textContent = formatQty(detailState.servings);
    return;
  }
  if(t.dataset.field === 'seed-custom'){ setThemeSeedLive(t.value); return; }
  if(t.dataset.field === 'import-text' || t.dataset.field === 'import-link'){
    if(t.dataset.field === 'import-text') importState.text = t.value;
    else importState.link = t.value;
    const runBtn = document.querySelector('[data-action="run-import"]');
    if(runBtn) runBtn.disabled = !t.value.trim();
    return;
  }
  if(t.dataset.field && editorDraft){
    const f = t.dataset.field, idx = t.dataset.idx;
    if(f === 'title') editorDraft.title = t.value;
    else if(f === 'description') editorDraft.description = t.value;
    else if(f === 'baseServings') editorDraft.baseServings = t.value;
    else if(f === 'ing-qty') editorDraft.ingredients[idx].qty = parseQty(t.value);
    else if(f === 'ing-unit') editorDraft.ingredients[idx].unit = t.value;
    else if(f === 'ing-name') editorDraft.ingredients[idx].name = t.value;
    else if(f === 'step-text') editorDraft.instructions[idx].text = t.value;
    else if(f === 'step-min') editorDraft.instructions[idx].timeMinutes = t.value ? parseInt(t.value,10) : null;
    return;
  }
  if(t.id === 'search-input'){ searchQuery = t.value; render(); document.getElementById('search-input').focus(); document.getElementById('search-input').selectionStart = document.getElementById('search-input').selectionEnd = searchQuery.length; }
});

document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && themeMenuOpen){ toggleThemeMenu(false); return; }
  if(e.target.dataset && e.target.dataset.tagInput && e.key === 'Enter'){
    e.preventDefault();
    const val = e.target.value.trim().replace(/,$/,'');
    if(val && !editorDraft.tags.includes(val)){ editorDraft.tags.push(val); render();
      const input = document.getElementById('f-tags'); if(input) input.focus();
    } else { e.target.value=''; }
  }
});

document.getElementById('photo-file-input').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => { editorDraft.photo = reader.result; render(); };
  reader.readAsDataURL(file);
  e.target.value = '';
});

/* ============================================================
   Init
   ============================================================ */
if(window.matchMedia){
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onSystemChange = () => { if(themeState.mode === 'system') applyTheme(); };
  if(mq.addEventListener) mq.addEventListener('change', onSystemChange);
  else if(mq.addListener) mq.addListener(onSystemChange);
}
applyTheme();
hydrateStaticIcons();
render();
</script>
</body>
</html>
