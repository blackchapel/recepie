<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Mise Recipe Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D0C0B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)">
<meta name="description" content="Mise: a recipe manager mockup with live ingredient scaling, step timers, tags, photo attachments and import from pasted text or shared links.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: a sticky sidebar rail beside a single content canvas. Raycast-style surface ladder and hairlines,
   spice-colored tags, and one saffron-to-paprika "flame" gradient reserved for import and timers. Dark-first. */
:root{
  --canvas:#0D0C0B; --surface:#151311; --surface-2:#1C1A17; --surface-3:#27241F;
  --overlay:rgba(8,7,6,.66);
  --line:rgba(255,236,214,.08); --line-strong:rgba(255,236,214,.16);
  --ink:#F7F2EB; --body:#D3CBBF; --mute:#A39A8D; --faint:#857D72;
  --cta:#F7F2EB; --on-cta:#17120D;
  --saffron:#FFB547; --paprika:#FF6B3D; --basil:#57D39A; --ube:#B49CFF; --sumac:#FF5C8D; --ocean:#5BC4FF;
  --accent-ink:#FFC56E;
  --flame:linear-gradient(120deg,#FFB547 0%,#FF6B3D 55%,#FF5C8D 100%);
  --on-flame:#1C0F06;
  --tag-mix:#FFFFFF; --tag-mix-pct:22%;
  --glass:rgba(14,11,9,.58); --glass-line:rgba(255,255,255,.14);
  --shadow-lg:0 30px 80px -24px rgba(0,0,0,.7);
  --shadow-md:0 18px 40px -20px rgba(0,0,0,.6);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --side-w:264px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --canvas:#F4F2EE; --surface:#FFFFFF; --surface-2:#EFECE7; --surface-3:#E4E0D9;
    --overlay:rgba(34,26,18,.36);
    --line:rgba(40,28,16,.09); --line-strong:rgba(40,28,16,.17);
    --ink:#18140F; --body:#3E382F; --mute:#655E53; --faint:#7A7267;
    --cta:#18140F; --on-cta:#FBF8F3;
    --saffron:#E3961A; --paprika:#EC5427; --basil:#1C9E66; --ube:#7A5AF0; --sumac:#E0396F; --ocean:#1C92D3;
    --accent-ink:#A35C00;
    --tag-mix:#000000; --tag-mix-pct:38%;
    --glass:rgba(20,15,10,.5); --glass-line:rgba(255,255,255,.22);
    --shadow-lg:0 30px 70px -26px rgba(70,46,20,.32);
    --shadow-md:0 16px 36px -22px rgba(70,46,20,.34);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --canvas:#F4F2EE; --surface:#FFFFFF; --surface-2:#EFECE7; --surface-3:#E4E0D9;
  --overlay:rgba(34,26,18,.36);
  --line:rgba(40,28,16,.09); --line-strong:rgba(40,28,16,.17);
  --ink:#18140F; --body:#3E382F; --mute:#655E53; --faint:#7A7267;
  --cta:#18140F; --on-cta:#FBF8F3;
  --saffron:#E3961A; --paprika:#EC5427; --basil:#1C9E66; --ube:#7A5AF0; --sumac:#E0396F; --ocean:#1C92D3;
  --accent-ink:#A35C00;
  --tag-mix:#000000; --tag-mix-pct:38%;
  --glass:rgba(20,15,10,.5); --glass-line:rgba(255,255,255,.22);
  --shadow-lg:0 30px 70px -26px rgba(70,46,20,.32);
  --shadow-md:0 16px 36px -22px rgba(70,46,20,.34);
  color-scheme:light;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--body);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color .4s var(--ease-out),color .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--canvas)}
img{max-width:100%;display:block}
h1,h2,h3,h4,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.skip{position:fixed;z-index:100;left:16px;top:-60px;padding:10px 14px;border-radius:10px;background:var(--cta);color:var(--on-cta);font-weight:600;text-decoration:none;transition:top .25s var(--ease-out)}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}
::selection{background:color-mix(in oklab,var(--saffron) 40%,transparent);color:var(--ink)}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:15px;height:15px}
.i-lg{width:22px;height:22px}
.i-fill{fill:currentColor;stroke:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.display{font-family:var(--f-display);font-weight:700;color:var(--ink);letter-spacing:-.03em;font-stretch:92%;text-wrap:balance}
.eyebrow{font:500 11.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.label{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;font-weight:550;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;transition:transform .25s var(--ease-spring),background-color .2s,border-color .2s,box-shadow .3s,color .2s;user-select:none}
.btn:hover{background:var(--surface-3);border-color:var(--line-strong)}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-cta{background:var(--cta);color:var(--on-cta);border-color:transparent}
.btn-cta:hover{background:var(--cta);box-shadow:0 0 0 4px color-mix(in oklab,var(--cta) 14%,transparent)}
.btn-flame{background:var(--flame);color:var(--on-flame);border:0;box-shadow:0 10px 28px -10px color-mix(in oklab,var(--paprika) 80%,transparent);background-size:140% 100%;background-position:0 0;transition:transform .25s var(--ease-spring),background-position .5s var(--ease-out),box-shadow .3s}
.btn-flame:hover{background-position:100% 0;box-shadow:0 14px 34px -10px color-mix(in oklab,var(--paprika) 90%,transparent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--body)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn-danger{color:var(--paprika)}
.btn-danger:hover{background:color-mix(in oklab,var(--paprika) 14%,transparent);border-color:color-mix(in oklab,var(--paprika) 35%,transparent)}
.btn-solid-danger{background:var(--paprika);color:#fff;border-color:transparent}
.btn-solid-danger:hover{background:color-mix(in oklab,var(--paprika) 88%,#000)}
.btn-sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.icon-btn{width:38px;padding:0}
.icon-btn.btn-sm{width:32px}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;font:500 11px/1 var(--f-mono);padding:0 6px;border-radius:6px;border:1px solid var(--line-strong);background:linear-gradient(var(--surface-3),var(--surface-2));color:var(--mute);box-shadow:0 1px 0 var(--line-strong)}

/* ---------- Shell ---------- */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;width:var(--side-w);flex:none;display:flex;flex-direction:column;gap:18px;padding:20px 14px 18px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font:800 23px/1 var(--f-display);color:var(--ink);letter-spacing:-.04em;font-stretch:90%}
.brand-sub{font:500 10.5px/1 var(--f-mono);color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.search-trigger{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);color:var(--mute);font-size:14px;transition:border-color .2s,background-color .2s}
.search-trigger:hover{border-color:var(--line-strong);color:var(--body)}
.search-trigger span:not(.kbd){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-trigger .kbd{margin-left:auto}
.nav{display:grid;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:10px;color:var(--body);font-size:14px;font-weight:500;text-align:left;width:100%;position:relative;transition:background-color .2s,color .2s}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--surface-3);color:var(--ink)}
.nav-item[aria-current="true"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--flame);animation:grow .4s var(--ease-spring)}
.nav-item .count{margin-left:auto;font:500 12px var(--f-mono);color:var(--faint)}
.nav-item .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in oklab,var(--c) 22%,transparent);flex:none;margin-inline:4px 3px}
.side-section{display:grid;gap:8px}
.side-section .label{padding:0 10px}
.side-foot{margin-top:auto;display:grid;gap:12px;padding-top:6px}
.side-foot .btn{width:100%}
.seg{--n:3;--idx:0;display:flex;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);position:relative;isolation:isolate}
.seg::before{content:"";position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));transform:translateX(calc(100% * var(--idx)));border-radius:8px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25),0 0 0 1px var(--line);transition:transform .45s var(--ease-spring)}
.seg button{flex:1;height:30px;border-radius:8px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:550;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.main{flex:1;min-width:0;padding-block:28px 140px;padding-left:max(clamp(16px,3.4vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3.4vw,48px),env(safe-area-inset-right,0px))}
.main:focus{outline:none}
.wrap{max-width:1240px;margin:0 auto}
.topbar,.tabbar{display:none}

/* ---------- Library ---------- */
.lib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.lib-head h1{font-size:clamp(38px,5.2vw,60px);line-height:.98;margin-top:10px}
.lib-head h1 em{font-style:normal;background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.lib-head .lede{margin-top:12px;color:var(--mute);font-size:15px}
.lib-actions{display:flex;gap:10px;flex-wrap:wrap}

.hero{position:relative;isolation:isolate;margin-block:26px 30px;border-radius:26px;padding:clamp(20px,3vw,34px);background:var(--surface);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,3vw,40px);align-items:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0deg,transparent 40deg,var(--saffron) 110deg,var(--paprika) 170deg,var(--sumac) 220deg,transparent 290deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 7s linear infinite;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--line);pointer-events:none}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
.hero .glow{position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.4}
.hero .glow.g1{width:380px;height:380px;left:-120px;top:-160px;background:var(--paprika);animation:drift 16s ease-in-out infinite alternate}
.hero .glow.g2{width:300px;height:300px;right:10%;bottom:-200px;background:var(--saffron);opacity:.28;animation:drift 19s ease-in-out infinite alternate-reverse}
.hero>div{min-width:0}
.hero h2{font-size:clamp(26px,3vw,36px);line-height:1.05;margin:12px 0 10px}
.hero p.sub{color:var(--mute);max-width:52ch}
.paste-box{margin-top:20px;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-strong);transition:border-color .25s,box-shadow .3s}
.paste-box:focus-within{border-color:color-mix(in oklab,var(--saffron) 70%,transparent);box-shadow:0 0 0 4px color-mix(in oklab,var(--saffron) 18%,transparent)}
.paste-box input{flex:1;min-width:0;height:42px;background:transparent;border:0;outline:none;color:var(--ink);font-size:15px}
.paste-box input::placeholder{color:var(--faint)}
.paste-box .i{color:var(--mute)}
.hero-tries{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.hero-tries .label{margin-right:4px}

.convert-demo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;font-size:12.5px}
.cd-card{position:relative;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;display:grid;gap:7px;overflow:hidden;min-height:196px}
.cd-bar{display:flex;align-items:center;gap:5px;margin-bottom:4px;color:var(--faint);font:500 10.5px var(--f-mono)}
.cd-bar i{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}
.cd-bar span{margin-left:6px}
.cd-src p{font-family:var(--f-mono);font-size:11.5px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-src .junk{color:var(--faint);text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--paprika) 70%,transparent)}
.cd-src mark{background:color-mix(in oklab,var(--saffron) 24%,transparent);color:var(--ink);border-radius:4px;padding:0 3px}
.cd-src mark.t{background:color-mix(in oklab,var(--ocean) 24%,transparent)}
.cd-scan{position:absolute;left:0;right:0;height:34px;top:0;background:linear-gradient(180deg,transparent,color-mix(in oklab,var(--saffron) 22%,transparent),transparent);animation:scan 3.4s var(--ease-out) infinite;pointer-events:none}
.cd-arrow{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--flame);color:var(--on-flame);box-shadow:0 8px 22px -8px var(--paprika);animation:breathe 3.4s ease-in-out infinite}
.cd-out .cd-title{font:700 15px/1.15 var(--f-display);color:var(--ink);letter-spacing:-.01em}
.cd-row{display:flex;gap:8px;align-items:baseline;color:var(--body);animation:shimmer 3.4s ease-in-out infinite;animation-delay:calc(var(--d) * .25s)}
.cd-row .q{font:600 12px var(--f-mono);color:var(--ink);min-width:44px}
.cd-timer{display:inline-flex;align-items:center;gap:6px;justify-self:start;padding:4px 9px;border-radius:999px;font:600 11.5px var(--f-mono);color:var(--ink);background:color-mix(in oklab,var(--ocean) 18%,transparent);border:1px solid color-mix(in oklab,var(--ocean) 35%,transparent)}
.cd-out .tags{margin-top:2px}

.banner{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-radius:14px;background:var(--surface);border:1px dashed var(--line-strong);margin-bottom:22px;font-size:14px;color:var(--mute);flex-wrap:wrap}
.banner b{color:var(--ink);font-weight:600}
.banner .grow{flex:1 1 240px;min-width:0}

.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin-bottom:22px;align-items:center}
.field-search{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,box-shadow .25s}
.field-search:focus-within{border-color:color-mix(in oklab,var(--saffron) 60%,transparent);box-shadow:0 0 0 4px color-mix(in oklab,var(--saffron) 14%,transparent)}
.field-search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--ink);height:100%}
.field-search input::placeholder{color:var(--faint)}
.field-search .i{color:var(--mute)}
.select{height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:0 34px 0 12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.chips{grid-column:1/-1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{--c:var(--saffron);flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--body);display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:550;white-space:nowrap;transition:background-color .25s,border-color .25s,color .2s,transform .25s var(--ease-spring)}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip:active{transform:scale(.95)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip .n{font:500 11.5px var(--f-mono);color:var(--faint)}
.chip[aria-pressed="true"]{background:color-mix(in oklab,var(--c) 18%,var(--surface));border-color:color-mix(in oklab,var(--c) 55%,transparent);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{--mx:50%;--my:0%;position:relative;border-radius:22px;padding:9px;background:var(--surface);border:1px solid var(--line);transition:transform .5s var(--ease-spring),border-color .3s,box-shadow .5s var(--ease-out);animation:rise .7s var(--ease-out) both;animation-delay:calc(var(--i,0) * 50ms)}
.grid.calm .card{animation:none}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;background:radial-gradient(360px circle at var(--mx) var(--my),color-mix(in oklab,var(--saffron) 13%,transparent),transparent 45%);opacity:0;transition:opacity .4s;pointer-events:none}
.card:hover{transform:translateY(-5px);border-color:var(--line-strong);box-shadow:var(--shadow-md)}
.card:hover::before{opacity:1}
.card-media{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:15px;overflow:hidden;background:var(--surface-2)}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease-out)}
.card:hover .card-media img.art{transform:scale(1.08) rotate(7deg)}
.card:hover .card-media img.photo{transform:scale(1.06)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.5);backdrop-filter:blur(12px) saturate(1.5);border:1px solid var(--glass-line);color:#fff}
.badge{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font:500 12px var(--f-mono)}
.badge.pic{left:auto;right:10px}
.fav{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .3s var(--ease-spring),background-color .2s}
.fav:hover{transform:scale(1.1)}
.fav[aria-pressed="true"] .i{fill:var(--sumac);stroke:var(--sumac);animation:pop .5s var(--ease-spring)}
.card-body{padding:14px 7px 7px;display:grid;gap:9px}
.card h3{font:680 18.5px/1.2 var(--f-display);color:var(--ink);letter-spacing:-.015em;font-stretch:95%}
.card-link{text-align:left;color:inherit}
.card-link::after{content:"";position:absolute;inset:0;border-radius:22px;z-index:1}
.card-link:focus-visible{outline:none}
.card:has(.card-link:focus-visible){outline:2px solid var(--saffron);outline-offset:3px}
.meta{display:flex;gap:6px 12px;flex-wrap:wrap;font:500 12.5px var(--f-mono);color:var(--mute)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{--c:var(--saffron);display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.005em;background:color-mix(in oklab,var(--c) 15%,transparent);color:color-mix(in oklab,var(--c),var(--tag-mix) var(--tag-mix-pct));border:1px solid color-mix(in oklab,var(--c) 30%,transparent);white-space:nowrap}
button.tag{cursor:pointer;transition:transform .2s var(--ease-spring),background-color .2s}
button.tag:hover{background:color-mix(in oklab,var(--c) 26%,transparent)}
.tag.more{--c:var(--mute)}
.tag-x{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;margin-right:-4px}
.tag-x:hover{background:color-mix(in oklab,var(--c) 30%,transparent)}
.result-line{display:flex;gap:10px;align-items:center;margin:-8px 0 16px;color:var(--mute);font-size:13.5px}
.empty{grid-column:1/-1;display:grid;justify-items:center;text-align:center;gap:12px;padding:56px 16px;border-radius:22px;border:1px dashed var(--line-strong);color:var(--mute)}
.empty .plate{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--surface-2) 0 46%,var(--surface-3) 47% 60%,var(--surface-2) 61%);display:grid;place-items:center;color:var(--faint);animation:wobble 4s ease-in-out infinite}
.empty h3{font:700 22px var(--f-display);color:var(--ink)}

/* ---------- Detail ---------- */
.d-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.d-actions{display:flex;gap:8px;flex-wrap:wrap}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(24px,4vw,56px);align-items:start}
.d-left{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));display:grid;gap:14px;min-width:0}
.d-hero{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:26px;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow-lg);cursor:zoom-in}
.d-hero img{width:100%;height:100%;object-fit:cover}
.d-hero img.art{animation:plate-in 1.4s var(--ease-out) both}
.d-hero .badge{left:14px;bottom:14px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:3px;margin:-3px;scrollbar-width:none}
.thumb{position:relative;width:74px;flex:none;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid transparent;background:var(--surface-2);transition:border-color .2s,transform .25s var(--ease-spring)}
.thumb:hover{transform:translateY(-2px)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb[aria-current="true"]{border-color:var(--saffron)}
.thumb-add{display:grid;place-items:center;gap:2px;border:1.5px dashed var(--line-strong);color:var(--mute);font-size:11px;font-weight:600;align-content:center}
.thumb-add:hover{color:var(--ink);border-color:var(--saffron)}
.note-card{border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:grid;gap:8px}
.note-card p{color:var(--body);font-size:14.5px}
.d-right{min-width:0}
.d-title{font-size:clamp(36px,4.6vw,58px);line-height:.98;margin:14px 0 14px}
.d-desc{font-size:17px;line-height:1.6;color:var(--body);max-width:60ch}
.d-source{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font:500 12.5px var(--f-mono);color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:24px 0 34px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.stat{padding:14px 16px;display:grid;gap:6px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:0}
.stat-val{font:700 22px/1.1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.stat-val small{font:500 12px var(--f-mono);color:var(--faint)}
.stat-val s{font:500 12px var(--f-mono);color:var(--faint)}
.stepper{display:flex;align-items:center;gap:4px}
.stat-val.stepper{flex-wrap:nowrap}
.stepper button{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);transition:transform .25s var(--ease-spring),background-color .2s}
.stepper button:hover{background:var(--surface-3)}
.stepper button:active{transform:scale(.88)}
.stepper .v{min-width:2.4ch;text-align:center}
.sec{margin-bottom:38px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font:700 26px/1.1 var(--f-display);color:var(--ink);letter-spacing:-.02em}
.sec-head .hint{font-size:13px;color:var(--mute)}
.seg.scale{--n:5}
.seg.custom::before{opacity:0}
.seg.scale button{min-width:46px;font-family:var(--f-mono);font-size:12.5px}
.scaled-note{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:14px;margin-bottom:12px;background:color-mix(in oklab,var(--saffron) 11%,transparent);border:1px solid color-mix(in oklab,var(--saffron) 32%,transparent);color:var(--accent-ink);font-size:13.5px;animation:slide-down .45s var(--ease-spring)}
.scaled-note .grow{flex:1;min-width:0}
.scaled-note b{font-weight:650}
.ings{list-style:none;padding:0;margin:0}
.ing{display:grid;grid-template-columns:30px minmax(92px,auto) minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px 6px;border-bottom:1px dashed var(--line);border-radius:10px;transition:background-color .3s}
.ing:hover{background:color-mix(in oklab,var(--surface-2) 70%,transparent)}
.ing-headrow{padding:20px 6px 6px}
.ing-headrow:first-child{padding-top:4px}
.qty{justify-self:end;display:inline-flex;align-items:baseline;gap:5px;padding:3px 7px;margin:-3px -7px;border-radius:8px;font:600 15px/1.3 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;border:1px solid transparent;transition:background-color .2s,border-color .2s,color .3s}
button.qty:hover{background:var(--surface-2);border-color:var(--line-strong)}
.qty .u{font-weight:450;color:var(--mute)}
.qty-input{justify-self:end;width:92px;height:32px;border-radius:9px;border:1px solid var(--saffron);background:var(--surface-2);color:var(--ink);font:600 15px var(--f-mono);text-align:right;padding:0 8px;outline:none;box-shadow:0 0 0 4px color-mix(in oklab,var(--saffron) 20%,transparent)}
.ing .name{color:var(--ink);font-size:15.5px;min-width:0}
.ing .note{color:var(--mute);font-size:13.5px}
.ing.checked .name,.ing.checked .qty{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.ing.anchor .qty{color:var(--accent-ink);background:color-mix(in oklab,var(--saffron) 14%,transparent)}
.check{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:background-color .25s,border-color .25s,transform .3s var(--ease-spring)}
.check:hover{border-color:var(--basil)}
.check[aria-checked="true"]{background:var(--basil);border-color:var(--basil);color:#062615;transform:scale(1.06)}
.check .i{width:13px;height:13px;stroke-width:3}
.bump{animation:bump .55s var(--ease-out)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.step{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;padding:16px 18px 16px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);transition:opacity .35s,border-color .3s,transform .4s var(--ease-spring)}
.step:hover{border-color:var(--line-strong)}
.step-num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 13.5px var(--f-mono);background:var(--surface-3);color:var(--ink);transition:background-color .3s,color .3s,transform .3s var(--ease-spring)}
.step-num:hover{transform:scale(1.08)}
.step.done{opacity:.5}
.step.done .step-num{background:var(--basil);color:#062615}
.step.done p{text-decoration:line-through;text-decoration-color:var(--faint)}
.step p{color:var(--body);font-size:16px;line-height:1.62;padding-top:4px}
.step-foot{display:flex;gap:8px 12px;align-items:center;margin-top:12px;flex-wrap:wrap}
.time-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-strong);font:550 13px var(--f-mono);color:var(--ink);transition:border-color .2s,background-color .25s,transform .25s var(--ease-spring)}
.time-chip:hover{border-color:var(--saffron)}
.time-chip:active{transform:scale(.95)}
.time-chip.running{background:color-mix(in oklab,var(--saffron) 17%,var(--surface));border-color:color-mix(in oklab,var(--saffron) 60%,transparent)}
.time-chip.finished{background:color-mix(in oklab,var(--basil) 17%,var(--surface));border-color:color-mix(in oklab,var(--basil) 60%,transparent)}
.time-chip .live{color:var(--accent-ink)}
.was{font:500 12px var(--f-mono);color:var(--faint);text-decoration:line-through}
.mode{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute)}

/* ---------- Editor ---------- */
.ed-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;margin:-12px 0 18px;background:color-mix(in oklab,var(--canvas) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-top h1{font-size:clamp(26px,3vw,34px)}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:22px;align-items:start}
.ed-col{display:grid;gap:22px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2vw,22px);display:grid;gap:16px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head h2{font:700 19px var(--f-display);color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.panel-head h2 .n{font:500 12px var(--f-mono);color:var(--faint)}
.field{display:grid;gap:7px;min-width:0}
.field>label,.field>.flabel{font-size:12.5px;font-weight:600;color:var(--mute)}
.input,.textarea{width:100%;min-width:0;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 12px;height:42px;outline:none;transition:border-color .2s,box-shadow .25s,background-color .2s}
.textarea{height:auto;padding:10px 12px;resize:vertical;line-height:1.55;min-height:84px}
.input:hover,.textarea:hover{border-color:var(--line-strong)}
.input:focus,.textarea:focus{border-color:color-mix(in oklab,var(--saffron) 75%,transparent);box-shadow:0 0 0 4px color-mix(in oklab,var(--saffron) 16%,transparent);background:var(--surface)}
.input::placeholder,.textarea::placeholder{color:var(--faint)}
.input.title-input{height:52px;font:700 22px var(--f-display);letter-spacing:-.01em}
.input.invalid{border-color:var(--paprika);box-shadow:0 0 0 4px color-mix(in oklab,var(--paprika) 16%,transparent)}
.err{color:var(--paprika);font-size:13px;font-weight:550}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.drop{position:relative;display:grid;place-items:center;text-align:center;gap:8px;padding:22px 16px;border-radius:16px;border:1.5px dashed var(--line-strong);color:var(--mute);transition:border-color .25s,background-color .25s,transform .3s var(--ease-spring);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--saffron);background:color-mix(in oklab,var(--saffron) 8%,transparent);color:var(--ink)}
.drop.over{transform:scale(1.015)}
.drop .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--flame);color:var(--on-flame)}
.drop b{color:var(--ink);font-weight:600}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--surface-2);animation:pop .45s var(--ease-spring)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .cover-badge{position:absolute;left:6px;top:6px;height:22px;padding:0 8px;border-radius:999px;font:600 10.5px var(--f-body);display:inline-flex;align-items:center;letter-spacing:.04em;text-transform:uppercase}
.ph-acts{position:absolute;inset:auto 6px 6px 6px;display:flex;gap:6px;justify-content:flex-end;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .3s var(--ease-spring)}
.ph:hover .ph-acts,.ph:focus-within .ph-acts{opacity:1;transform:none}
.ph-acts button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.art-preview{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.art-preview img{width:100%;height:100%;object-fit:cover}
.art-preview .badge{font-family:var(--f-body);font-weight:550}
.tag-input{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px;padding:6px 8px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);transition:border-color .2s,box-shadow .25s}
.tag-input:focus-within{border-color:color-mix(in oklab,var(--saffron) 75%,transparent);box-shadow:0 0 0 4px color-mix(in oklab,var(--saffron) 16%,transparent)}
.tag-input input{flex:1;min-width:110px;height:30px;border:0;background:transparent;outline:none;color:var(--ink)}
.tag-input .tag{animation:pop .35s var(--ease-spring)}
.suggest{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.suggest .label{margin-right:2px}
.ed-rows{display:grid;gap:8px}
.ing-row{display:grid;grid-template-columns:22px 78px 96px minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center;animation:row-in .4s var(--ease-out)}
.ing-row.head-row{grid-template-columns:22px minmax(0,1fr) auto}
.ing-row.head-row .input{font-weight:650;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
.grip{color:var(--faint);display:grid;place-items:center}
.row-acts{display:flex;gap:2px}
.row-acts button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mute);transition:background-color .2s,color .2s}
.row-acts button:hover{background:var(--surface-3);color:var(--ink)}
.row-acts button.del:hover{color:var(--paprika);background:color-mix(in oklab,var(--paprika) 14%,transparent)}
.row-acts button[disabled]{opacity:.3;pointer-events:none}
.step-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);animation:row-in .4s var(--ease-out)}
.step-row .step-num{width:30px;height:30px;font-size:12.5px;background:var(--surface-3)}
.step-row .textarea{min-height:64px;background:var(--surface)}
.step-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.step-meta .input{height:36px;background:var(--surface)}
.step-meta .min{width:96px;position:relative}
.step-meta .min .input{padding-right:38px}
.step-meta .min span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font:500 12px var(--f-mono);color:var(--faint);pointer-events:none}
.step-meta .select{height:36px;background-color:var(--surface);background-position:calc(100% - 17px) 15px,calc(100% - 12px) 15px}
.detect{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;font:550 12px var(--f-body);color:var(--accent-ink);background:color-mix(in oklab,var(--saffron) 12%,transparent);border:1px dashed color-mix(in oklab,var(--saffron) 45%,transparent);animation:pop .35s var(--ease-spring)}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.ed-help{font-size:13px;color:var(--mute)}

/* ---------- Overlays ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:var(--overlay);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .3s var(--ease-out)}
.scrim.top{place-items:start center;padding-top:max(11vh,env(safe-area-inset-top,0px))}
.dialog{position:relative;width:min(520px,100%);max-height:min(90dvh,940px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:24px;box-shadow:var(--shadow-lg);animation:dlg-in .5s var(--ease-spring);overscroll-behavior:contain}
.scrim.closing{animation:fade .22s ease-in reverse forwards}
.scrim.closing .dialog{animation:dlg-out .22s ease-in forwards}
.dlg-pad{padding:22px}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dlg-head h2{font:700 22px/1.2 var(--f-display);color:var(--ink);letter-spacing:-.015em}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.confirm-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in oklab,var(--paprika) 16%,transparent);color:var(--paprika);margin-bottom:14px}

.palette{width:min(640px,100%);border-radius:20px;overflow:hidden;max-height:min(70dvh,620px);display:flex;flex-direction:column}
.pal-input{display:flex;align-items:center;gap:12px;padding:0 18px;height:60px;border-bottom:1px solid var(--line);flex:none}
.pal-input input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink);font-size:17px;height:100%}
.pal-input input::placeholder{color:var(--faint)}
.pal-list{overflow-y:auto;padding:8px;flex:1}
.pal-group{padding:10px 10px 6px}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:6px 10px;border-radius:12px;text-align:left;color:var(--body)}
.pal-item[aria-selected="true"]{background:var(--surface-3);color:var(--ink)}
.pal-item .thumbimg{width:34px;height:34px;border-radius:9px;overflow:hidden;flex:none;background:var(--surface-2)}
.pal-item .thumbimg img{width:100%;height:100%;object-fit:cover}
.pal-item .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none}
.pal-item .t{flex:1;min-width:0}
.pal-item .t b{display:block;font-weight:550;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item .t small{display:block;font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item .kbd{margin-left:auto}
.pal-foot{display:flex;gap:16px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);flex:none;flex-wrap:wrap}
.pal-foot span{display:inline-flex;gap:6px;align-items:center}
.pal-empty{padding:30px 16px;text-align:center;color:var(--mute)}

.import{width:min(1080px,100%);display:flex;flex-direction:column;max-height:min(92dvh,900px);overflow:hidden}
.imp-head{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.imp-head .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--flame);color:var(--on-flame);flex:none}
.imp-head h2{font:700 21px var(--f-display);color:var(--ink);letter-spacing:-.015em}
.imp-head p{font-size:13px;color:var(--mute)}
.imp-head .seg{--n:2;margin-left:auto;min-width:260px}
.imp-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);flex:1;min-height:0}
.imp-src,.imp-out{padding:20px;overflow-y:auto;min-width:0;display:flex;flex-direction:column;gap:14px}
.imp-out{background:var(--canvas);border-left:1px solid var(--line)}
.imp-src textarea{flex:1;min-height:300px;font:13px/1.6 var(--f-mono)}
.imp-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- Timers + toasts ---------- */
.timers{position:fixed;z-index:50;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;width:min(330px,calc(100vw - 32px));pointer-events:none}
.timer{pointer-events:auto;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 10px 10px 12px;border-radius:18px;background:color-mix(in oklab,var(--surface-2) 90%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);animation:slide-up .55s var(--ease-spring)}
.timer.leaving{animation:slide-out .3s ease-in forwards}

.timer .acts button:hover{background:var(--surface-3);color:var(--ink)}
.timer.done{border-color:color-mix(in oklab,var(--basil) 70%,transparent);animation:ring-done 1.2s ease-in-out infinite}

.toast .i{color:var(--on-cta)}

/* ---------- View transitions ---------- */
::view-transition-old(root),::view-transition-new(root){animation-duration:.42s;animation-timing-function:var(--ease-out)}
::view-transition-old(root){animation-name:vt-out}
::view-transition-new(root){animation-name:vt-in}
::view-transition-group(hero){animation-duration:.6s;animation-timing-function:cubic-bezier(.3,1.2,.4,1);z-index:5}
::view-transition-old(hero),::view-transition-new(hero){animation-duration:.6s;height:100%;object-fit:cover;overflow:hidden}

/* ---------- Keyframes ---------- */
@keyframes spin{to{--ang:360deg}}
@keyframes spin2{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(90px,50px) scale(1.25)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:.4}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes pop-row{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:translateY(-70%);opacity:0;filter:blur(3px)}55%{opacity:1;filter:none;color:var(--accent-ink)}100%{transform:none}}
@keyframes scan{0%{transform:translateY(-40px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(220px);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.1) rotate(12deg)}}

@keyframes plate-in{from{transform:rotate(-16deg) scale(1.12)}to{transform:none}}
@keyframes slide-down{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes slide-up{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
@keyframes slide-out{to{opacity:0;transform:translateX(40px) scale(.96)}}
@keyframes row-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dlg-in{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes dlg-out{to{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes drop-in{from{opacity:0;transform:translate(-50%,-30px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes drop-out{to{opacity:0;transform:translate(-50%,-20px) scale(.95)}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes toast-in{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(10px) scale(.95)}}
@keyframes cook-in{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes cook-in-back{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

function inferArt(r) {
  const txt = (r.title + ' ' + r.ingredients.map(i => i.name).join(' ')).toLowerCase();
  const R = rng(hashStr(r.title || r.id));
  const tables = [['#3b2c22', '#24190f'], ['#2f3b48', '#1b2430'], ['#c9b9a2', '#a7947a'], ['#33402c', '#1e281a'], ['#4a2f3a', '#2b1a22']];
  const art = { vessel: R() > .5 ? 'bowl' : 'plate', vesselColor: R() > .5 ? '#f1ece3' : '#20303f', table: tables[Math.floor(R() * tables.length)], base: ['#ead9b4', '#cdb98a'], fill: .8, items: [] };
  if (/tomato|gochujang|chili|paprika|sriracha|harissa/.test(txt)) art.base = ['#d4562f', '#a83a1e'];
  if (/curry|pesto|matcha/.test(txt)) art.base = ['#a9c75b', '#6f9a34'];
  if (/chocolate|cocoa/.test(txt)) art.base = ['#6b3d24', '#3d1f10'];
  if (/\brice\b/.test(txt)) { art.base = ['#f6f2ea', '#ddd5c4']; art.items.push({ k: 'grain', n: 200, s: .012, c: '#ffffff' }); }
  if (/orzo|risotto/.test(txt)) { art.base = ['#f0e2c0', '#d6c08c']; art.items.push({ k: 'grain', n: 200, s: .013, c: '#fbf1d6' }); }
  if (/\b(tofu|paneer|halloumi)\b|chicken(?!\s+(broth|stock))/.test(txt)) art.items.push({ k: 'chunk', n: 10, s: .075, c: /gochujang|glaze|honey|soy/.test(txt) ? '#c4482a' : '#ecd9b0' });
  if (/cucumber/.test(txt)) art.items.push({ k: 'citrus', n: 5, s: .075, c: '#4f8a34', flesh: '#dcedb8' });
  if (/spinach|kale|basil|cilantro|parsley|herb|rocket/.test(txt)) art.items.push({ k: 'leaf', n: 16, s: .05, c: '#3f7f33' });
  if (/scallion|spring onion|chive/.test(txt)) art.items.push({ k: 'ring', n: 18, s: .02, c: '#8fd16e' });
  if (/lemon|lime/.test(txt)) art.items.push({ k: 'fleck', n: 40, s: .007, c: '#f3d23c' });
  if (/sesame/.test(txt)) art.items.push({ k: 'fleck', n: 60, s: .006, c: '#fbf1d8' });
  if (/parmesan|cheese|feta/.test(txt)) art.items.push({ k: 'fleck', n: 60, s: .008, c: '#fff6dc' });

  return art;
}

function readImage(file, max = 1600) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('type'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('read'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('decode'));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);

      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    ingredients: p.ingredients.map(i => i.heading ? { id: uid(), heading: true, name: i.name } : { id: uid(), qty: i.qty, unit: i.unit, name: i.name, note: i.note }),
    steps: p.steps.map(s => ({ id: uid(), text: s.text, time: s.time, scale: s.scale })) };
  return r;
}
function simulateShare(url = DEMO_LINKS[0]) {
  const el = document.createElement('div');
  el.className = 'incoming'; el.setAttribute('role', 'status');
  el.innerHTML = `<span class="ic">${icon('share', 'i-lg')}</span><div style="min-width:0"><b>Link shared to Mise</b><small>${esc(url.replace(/^https?:\/\//, ''))}</small></div><span class="bar"><i></i></span>`;
  document.body.appendChild(el);
  setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 340); while (layers.length) closeLayer(); setTimeout(() => openImport('link', url, true), 120); }, reduced.matches ? 300 : 1700);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
</script>
<script>
'use strict';
/* =========================================================
   Router with view transitions
   ========================================================= */
function render() {
  renderChrome();
  if (S.view === 'detail') renderDetail();
  else if (S.view === 'edit') renderEditor();
  else renderLibrary();
}
function go(view, id = null, { from = null } = {}) {
  const prevView = S.view, prevId = S.id;
  if (view === 'edit') { if (S.view === 'library') S.libScroll = scrollY; startEdit(id, arguments[2] && arguments[2].preset); }
  if (view === 'detail' && prevView === 'library') S.libScroll = scrollY;
  if (view === 'detail' && (id !== prevId || prevView !== 'edit')) { S.factor = 1; S.anchor = null; S.checked = new Set(); S.done = new Set(); S.photo = 0; }
  const update = () => {
    S.view = view; S.id = id;
    if (view === 'library' && prevView === 'detail') S.calm = true;
    render();
    const y = view === 'library' && prevView !== 'library' ? S.libScroll : 0;
    window.scrollTo({ top: view === prevView && view === 'library' ? scrollY : y, behavior: 'instant' });
  };
  const canVT = document.startViewTransition && !reduced.matches;
  if (!canVT) { update(); if (!reduced.matches && view !== prevView) main.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.22,1,.36,1)' }); return; }
  // Shared-element morph between a card image and the detail hero.
  let src = from;
  if (!src && prevView === 'detail' && view === 'library') src = $('#d-hero-img');
  if (src) src.style.viewTransitionName = 'hero';
  const vt = document.startViewTransition(() => {
    if (src) src.style.viewTransitionName = '';
    update();
    const target = view === 'detail' ? $('#d-hero-img') : view === 'library' && prevId ? $(`img[data-vt="${prevId}"]`) : null;
    if (src && target) target.style.viewTransitionName = 'hero';
  });
  vt.finished.finally(() => $$('img').forEach(i => { if (i.style.viewTransitionName) i.style.viewTransitionName = ''; }));
}
function cycleTheme() { const i = THEMES.findIndex(t => t[0] === S.theme); setTheme(THEMES[(i + 1) % 3][0]); toast(`Theme: ${THEMES[(i + 1) % 3][2]}`, { icon: THEMES[(i + 1) % 3][1] }); }
function setTheme(v) {
  S.theme = v; store.set('mise.theme', v);
  const apply = () => { applyTheme(); renderChrome(); };
  if (document.startViewTransition && !reduced.matches) document.startViewTransition(apply); else apply();
}

/* =========================================================
   Events
   ========================================================= */
const ACT = {
  nav: b => { S.nav = b.dataset.nav; S.tag = null; S.q = ''; if (S.view !== 'library') go('library'); else { render(); } },
  tag: b => { const t = b.dataset.tag || null; S.tag = S.tag === t ? null : t; if (S.tag) S.nav = 'all'; if (S.view !== 'library') { S.libScroll = 0; go('library'); } else { S.calm = false; renderChrome(); renderLibrary(); } },
  'clear-filters': () => { S.tag = null; S.q = ''; S.nav = 'all'; render(); },
  open: b => go('detail', b.dataset.id, { from: $(`img[data-vt="${b.dataset.id}"]`) }),
  back: () => go('library'),
  fav: b => {
    const r = byId(b.dataset.id); r.favorite = !r.favorite; persist();
    b.setAttribute('aria-pressed', r.favorite); b.setAttribute('aria-label', `${r.favorite ? 'Remove from' : 'Add to'} favorites`);
    if (S.view === 'detail') { b.style.color = r.favorite ? 'var(--sumac)' : ''; b.innerHTML = icon('heart', r.favorite ? 'i-fill' : ''); }
    renderChrome();
    if (S.view === 'library' && S.nav === 'fav' && !r.favorite) setTimeout(refreshGrid, 250);
    toast(r.favorite ? 'Added to favorites' : 'Removed from favorites', { icon: 'heart' });
  },
  new: () => { closeAll(); go('edit', null); },
  edit: b => go('edit', b.dataset.id),
  delete: b => confirmDelete(b.dataset.id),
  'confirm-delete': b => doDelete(b.dataset.id),
  close: () => closeLayer(),
  palette: () => { if (!layers.some(l => l.el.querySelector('.palette'))) openPalette(); },
  import: () => { closeAll(); openImport('text'); },
  'import-sample': () => openImport('text', DEMO_PAGES[pageKey(DEMO_LINKS[0])]),
  'simulate-share': () => simulateShare(DEMO_LINKS[S.shareN = ((S.shareN ?? -1) + 1) % 2]),
  theme: b => setTheme(b.dataset.v),
  'cycle-theme': () => cycleTheme(),
  'dismiss-banner': () => { S.banner = false; store.set('mise.banner', false); const el = $('.banner'); if (el) el.remove(); },
  'reset-demo': () => {
    const mine = recipes.filter(r => !r.sample), seeds = seedRecipes();
    recipes = [...mine, ...seeds]; persist(); render(); toast('Example recipes restored', { icon: 'reset' });
  },
  // Detail
  scale: b => setFactor(+b.dataset.f),
  serv: b => { const r = byId(S.id), cur = r.servings * S.factor, d = +b.dataset.d; const next = Math.max(1, d > 0 ? Math.floor(cur + 1e-6) + 1 : Math.ceil(cur - 1e-6) - 1); setFactor(next / r.servings); },
  'reset-scale': () => setFactor(1),
  'qty-edit': b => editQty(b),
  'check-ing': b => { const id = b.dataset.id; S.checked.has(id) ? S.checked.delete(id) : S.checked.add(id); const on = S.checked.has(id); b.setAttribute('aria-checked', on); b.closest('.ing').classList.toggle('checked', on); },
  'check-step': b => { const id = b.dataset.id; S.done.has(id) ? S.done.delete(id) : S.done.add(id); updateScaled(false); },
  timer: b => { const r = byId(S.id), i = r.steps.findIndex(s => s.id === b.dataset.id); toggleTimer(r, r.steps[i], i); },
  cook: () => openCook(),
  photo: b => { S.photo = +b.dataset.i; const r = byId(S.id), img = $('#d-hero-img'); img.src = r.photos[S.photo]; img.animate([{ opacity: .3, transform: 'scale(1.03)' }, { opacity: 1, transform: 'none' }], { duration: reduced.matches ? 1 : 420, easing: 'cubic-bezier(.22,1,.36,1)' }); $$('.thumb[data-i]').forEach(t => t.setAttribute('aria-current', +t.dataset.i === S.photo)); },
  'add-photo': () => $('#file-detail').click(),
  lightbox: () => openLightbox(),
  lb: b => { const L = topLayer(); L && L.step && L.step(+b.dataset.d); },
  ck: b => { const L = topLayer(); L && L.go && L.go(+b.dataset.d); },
  'ck-timer': () => { const L = topLayer(); if (L && L.stepObj) { toggleTimer(L.recipe, L.stepObj, L.idx); updateCookTimer(); } },
  // Timers
  't-toggle': b => { const t = timers.find(x => x.id === b.dataset.tid); t && (t.running ? pauseTimer(t) : resumeTimer(t)); updateTimerNodes(); },
  't-add': b => { const t = timers.find(x => x.id === b.dataset.tid); t && addMinute(t); },
  't-close': b => removeTimer(b.dataset.tid),
  // Editor
  'ed-cancel': () => { if (S.draft && JSON.stringify(S.draft) !== S.draftSnap) return confirmDiscard(); discardDraft(); },
  'discard-yes': () => { closeLayer(); discardDraft(); },
  'ed-save': () => saveDraft(),
  'ing-add': () => { const n = { id: uid(), qty: null, qtyText: '', unit: '', name: '', note: '' }; S.draft.ingredients.push(n); renderEdIngs(n.id); },
  'ing-head': () => { const n = { id: uid(), heading: true, name: '' }; S.draft.ingredients.push(n); renderEdIngs(n.id); },
  'ing-del': b => { const i = +b.dataset.i, row = b.closest('.ing-row'); const fin = () => { S.draft.ingredients.splice(i, 1); renderEdIngs(); }; if (row && !reduced.matches) { row.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateX(16px)' }], { duration: 180 }).onfinish = fin; } else fin(); },
  'ing-move': b => { const L = S.draft.ingredients, i = +b.dataset.i, j = i + +b.dataset.d; if (j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; renderEdIngs(); const btn = $(`[data-row="${L[j].id}"] [data-action="ing-move"][data-d="${b.dataset.d}"]`); (btn && !btn.disabled ? btn : $(`[data-row="${L[j].id}"] input`)).focus(); },
  'step-add': () => { const n = { id: uid(), text: '', time: 0, scale: 'fixed' }; S.draft.steps.push(n); renderEdSteps(n.id); },
  'step-del': b => { const i = +b.dataset.i, row = b.closest('.step-row'); const fin = () => { S.draft.steps.splice(i, 1); renderEdSteps(); }; if (row && !reduced.matches) { row.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateX(16px)' }], { duration: 180 }).onfinish = fin; } else fin(); },
  'step-move': b => { const L = S.draft.steps, i = +b.dataset.i, j = i + +b.dataset.d; if (j < 0 || j >= L.length) return; [L[i], L[j]] = [L[j], L[i]]; renderEdSteps(); const btn = $(`[data-row="${L[j].id}"] [data-action="step-move"][data-d="${b.dataset.d}"]`); (btn && !btn.disabled ? btn : $(`#st-${L[j].id}`)).focus(); },
  'use-detect': b => { const s = S.draft.steps[+b.dataset.i]; s.time = detectTime(s.text); s.scale = guessScale(s.text); renderEdSteps(); },
  'tag-add': b => addTag(b.dataset.tag),
  'tag-del': b => { S.draft.tags = S.draft.tags.filter(t => t !== b.dataset.tag); renderEdTags(); $('#ed-tag').focus(); },
  'ph-del': b => { const d = S.draft, i = +b.dataset.i; d.photos.splice(i, 1); if ((d.cover || 0) >= d.photos.length) d.cover = 0; else if (i < (d.cover || 0)) d.cover--; renderEdPhotos(); },
  'ph-cover': b => { S.draft.cover = +b.dataset.i; renderEdPhotos(); },
  // Import
  'imp-tab': b => { if (IMP.busy) return; IMP.tab = b.dataset.tab; IMP.msg = ''; if (IMP.tab === 'text') IMP.parsed = IMP.text.trim() ? parseRecipeText(IMP.text) : null; else IMP.parsed = null, IMP.pipe = []; IMP.keys = new Set(); drawImpSrc(); drawImpOut(); },
  'imp-sample': () => { IMP.text = DEMO_PAGES[pageKey(DEMO_LINKS[IMP.text === DEMO_PAGES[pageKey(DEMO_LINKS[0])] ? 1 : 0])]; IMP.parsed = parseRecipeText(IMP.text); IMP.keys = new Set(); drawImpSrc(); drawImpOut(); },
  'imp-clear': () => { IMP.text = ''; IMP.parsed = null; drawImpSrc(); drawImpOut(); $('#imp-text').focus(); },
  'imp-demo': b => { IMP.url = b.dataset.url; const i = $('#imp-url'); if (i) i.value = IMP.url; convertLink(); },
  'imp-save': () => {
    if (!IMP.parsed) return;
    const r = parsedToRecipe(IMP.parsed); r.id = uid(); r.created = r.updated = Date.now(); r.sample = false;
    recipes.unshift(r); persist(); closeAll(); IMP.text = ''; IMP.parsed = null; IMP.url = ''; IMP.pipe = [];
    go('detail', r.id); toast(`Imported “${r.title}”`, { icon: 'check' });
  },
  'imp-edit': () => { if (!IMP.parsed) return; const r = parsedToRecipe(IMP.parsed); closeAll(); IMP.text = ''; IMP.parsed = null; IMP.pipe = []; go('edit', null, { preset: r }); }
};
function discardDraft() { const d = S.draft; S.draft = null; if (d && d.id) go('detail', d.id); else go('library'); }
function confirmDiscard() {
  openLayer(`<div class="dlg-pad"><div class="dlg-head"><h2>Discard your changes?</h2></div><p style="margin-top:8px;color:var(--mute)">Your edits to this recipe haven’t been saved.</p><div class="dlg-foot"><button class="btn" data-action="close" autofocus>Keep editing</button><button class="btn btn-solid-danger" data-action="discard-yes">Discard changes</button></div></div>`, { label: 'Discard changes' });
}
window.addEventListener('beforeunload', e => { if (S.view === 'edit' && S.draft && JSON.stringify(S.draft) !== S.draftSnap) { e.preventDefault(); e.returnValue = ''; } });
function closeAll() { while (layers.length) closeLayer(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.action];
  if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'hero') {
    const v = $('#hero-input').value.trim();
    if (!v) { openImport('text'); return; }
    if (/^(https?:\/\/)?[\w.-]+\.[a-z]{2,}\/?\S*$/i.test(v) && !/\s/.test(v)) openImport('link', v, true); else openImport('text', v);
    $('#hero-input').value = '';
  } else if (f.dataset.form === 'imp-url') convertLink();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lib-q') { S.q = t.value; refreshGrid(); return; }
  if (!S.draft) return;
  if (t.dataset.bind) { S.draft[t.dataset.bind] = t.value; if (t.dataset.bind === 'title') { t.classList.remove('invalid'); const er = t.nextElementSibling; if (er && er.classList.contains('err')) er.remove(); renderEdPhotosDebounced(); } return; }
  if (t.dataset.ing != null) { S.draft.ingredients[+t.dataset.ing][t.dataset.f] = t.value; return; }
  if (t.dataset.step != null) {
    const s = S.draft.steps[+t.dataset.step]; s[t.dataset.f] = t.dataset.f === 'time' ? t.value : t.value;
    if (t.dataset.f === 'text' || t.dataset.f === 'time') { const slot = $(`[data-detect="${t.dataset.step}"]`), det = !+s.time ? detectTime(s.text) : 0; const html = det ? `<button class="detect" data-action="use-detect" data-i="${t.dataset.step}">${icon('spark', 'i-sm')}Found ${fmtMin(det)} · use it</button>` : ''; if (slot && slot.dataset.h !== html) { slot.innerHTML = html; slot.dataset.h = html; } }
    return;
  }
  if (t.id === 'ed-tag') renderSuggest(t.value.trim().toLowerCase());
});
const renderEdPhotosDebounced = debounce(() => { if (S.draft && !S.draft.photos.length) renderEdPhotos(); }, 500);
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'lib-sort') { S.sort = t.value; refreshGrid(); }
  if (t.id === 'file-detail') { const r = byId(S.id); if (!r) return; r.photos = r.photos || []; const n = await addPhotos(t.files, r); t.value = ''; if (n) { S.photo = r.photos.length - 1; r.updated = Date.now(); persist(); renderDetail(); toast(`Added ${n} photo${n > 1 ? 's' : ''}`, { icon: 'camera' }); } }
});
document.addEventListener('keydown', e => {
  const t = e.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable;
  if (e.key === 'Tab') trapFocus(e);
  if (t.id === 'ed-tag') {
    if ((e.key === 'Enter' || e.key === ',') && t.value.trim()) { e.preventDefault(); addTag(t.value); return; }
    if (e.key === 'Enter') { e.preventDefault(); return; }
    if (e.key === 'Backspace' && !t.value && S.draft.tags.length) { S.draft.tags.pop(); renderEdTags(); $('#ed-tag').focus(); return; }
  }
  if (t.dataset && t.dataset.ing != null && e.key === 'Enter') { e.preventDefault(); ACT['ing-add'](); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!layers.some(l => l.el.querySelector('.palette'))) openPalette(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && S.view === 'edit' && !layers.length) { e.preventDefault(); saveDraft(); return; }
  if (e.key === 'Escape' && layers.length) { e.preventDefault(); closeLayer(); return; }
  const L = topLayer();
  if (L && L.go && !typing && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); L.go(e.key === 'ArrowRight' ? 1 : -1); return; }
  if (L && L.step && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); L.step(e.key === 'ArrowRight' ? 1 : -1); return; }
  if (typing || layers.length || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); const q = $('#lib-q'); q ? q.focus() : openPalette(); }
  else if (e.key === 'n') { e.preventDefault(); go('edit', null); }
  else if (e.key === 'i') { e.preventDefault(); openImport('text'); }
  else if (e.key === 'Escape' && S.view === 'detail') go('library');
});
// Paste anywhere: a link or recipe text opens the importer.
document.addEventListener('paste', e => {
  const t = e.target;
  if (/^(INPUT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable || layers.length) {
    if (t.dataset && t.dataset.f === 'name' && t.dataset.ing != null) {
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      const lines = txt.split(/\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length > 1) {
        e.preventDefault();
        const i = +t.dataset.ing, rows = lines.map(l => { const p = parseIngredientLine(l) || { qty: null, unit: '', name: l, note: '' }; return { id: uid(), qty: p.qty, qtyText: p.qty == null ? '' : toFraction(p.qty), unit: p.unit, name: p.name, note: p.note }; });
        const cur = S.draft.ingredients[i];
        S.draft.ingredients.splice(i, cur.name || cur.qtyText ? 0 : 1, ...rows);
        renderEdIngs(); toast(`Added ${rows.length} ingredients`, { icon: 'clip' });
      }
    }
    return;
  }
  const txt = (e.clipboardData || window.clipboardData).getData('text').trim();
  if (!txt) return;
  e.preventDefault();
  if (/^https?:\/\/\S+$/i.test(txt)) openImport('link', txt, true); else openImport('text', txt);
});
// Spotlight that follows the pointer across cards
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.card'); if (!c) return;
  const b = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - b.left) + 'px'); c.style.setProperty('--my', (e.clientY - b.top) + 'px');
}, { passive: true });

/* =========================================================
   Boot
   ========================================================= */
render();
</script>
