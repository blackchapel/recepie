# Categorizes GitHub's auto-generated release notes (used by
# .github/workflows/release.yml's generate_release_notes step) by PR
# label. A PR with none of these labels lands in "Other Changes" via the
# "*" catch-all -- label PRs accordingly when opening them.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Fixes"
      labels:
        - fix
        - bug
    - title: "📝 Documentation"
      labels:
        - documentation
        - docs
    - title: "🧰 Maintenance"
      labels:
        - chore
        - maintenance
        - dependencies
        - ci
    - title: "Other Changes"
      labels:
        - "*"
